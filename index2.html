<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 消费人格诊断</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Content Container */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .content-container::-webkit-scrollbar {
            width: 4px;
        }

        .content-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .page-subtitle {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        /* Input Card */
        .input-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px;
        }

        /* Image Upload Section */
        .image-upload-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .image-upload-area {
            width: 100%;
            height: 180px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.03);
        }

        .image-upload-area:hover {
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(168, 85, 247, 0.1);
        }

        .image-upload-area.has-image {
            border: none;
            padding: 0;
            overflow: hidden;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .upload-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .remove-image-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .remove-image-btn:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        /* Date Input Section */
        .date-input-section {
            margin-bottom: 24px;
        }

        .date-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .date-input:focus {
            border-color: rgba(168, 85, 247, 0.6);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Analyze Button */
        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #06b6d4 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .analyze-btn svg {
            width: 24px;
            height: 24px;
        }

        .analyze-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Result Card */
        .result-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 60%);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10%, 10%); }
        }

        .result-content {
            position: relative;
            z-index: 1;
        }

        .personality-avatar {
            font-size: 80px;
            text-align: center;
            margin-bottom: 16px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .personality-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .device-info {
            text-align: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .personality-description {
            font-size: 15px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            margin-bottom: 24px;
        }

        .share-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .share-hint {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .share-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .share-btn svg {
            width: 20px;
            height: 20px;
        }

        .retry-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .retry-btn:hover {
            background: rgba(168, 85, 247, 0.1);
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }

        /* Loading Indicator */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 40px 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="返回首页">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="brand">
                    <div class="brand-logo">P</div>
                    <div class="brand-name">消费人格</div>
                </div>
                <div class="status-dot"></div>
            </div>
        </div>

        <!-- Content Container -->
        <div class="content-container" id="contentContainer">
            <!-- Input Section -->
            <div id="inputSection">
                <h1 class="page-title">你的消费人格</h1>
                <p class="page-subtitle">拍下你的电子产品，测测你的赛博成分！</p>
                
                <div class="input-card">
                    <!-- Image Upload -->
                    <div class="image-upload-section">
                        <label class="section-label">📱 拍下你的电子产品</label>
                        <div class="image-upload-area" id="imageUploadArea">
                            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
                            <div id="uploadPlaceholder">
                                <div class="upload-icon">📷</div>
                                <div class="upload-text">点击拍照或上传图片</div>
                                <div class="upload-hint">清晰的产品外观有助于准确识别</div>
                            </div>
                            <div id="imagePreview" style="display: none; width: 100%; height: 100%;">
                                <div class="image-preview-container">
                                    <img class="preview-image" id="previewImage" src="" alt="预览">
                                    <button class="remove-image-btn" id="removeImageBtn">×</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Date Input -->
                    <div class="date-input-section">
                        <label class="section-label">📅 你是什么时候买的？</label>
                        <input type="date" class="date-input" id="purchaseDate">
                    </div>

                    <!-- Analyze Button -->
                    <button class="analyze-btn" id="analyzeBtn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>开始诊断</span>
                    </button>
                </div>
            </div>

            <!-- Result Section -->
            <div id="resultSection" style="display: none;">
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item" id="nav1">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>咨询</span>
            </div>
            <div class="nav-item active" id="nav2">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>人格诊断</span>
            </div>
            <div class="nav-item" id="nav3">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <span>历史</span>
            </div>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <input type="file" id="fileInputHidden" accept="image/*">

    <script>
        // App State
        const state = {
            apiKey: localStorage.getItem('doubao_api_key') || 'ark-0a58b840-8bb3-4c90-8528-413397e9be41-de715',
            modelId: localStorage.getItem('doubao_model_id') || 'apikey-20260526164024-jtmz7',
            selectedImage: null,
            isLoading: false
        };

        // DOM Elements
        const backBtn = document.getElementById('backBtn');
        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInputHidden = document.getElementById('fileInputHidden');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const purchaseDate = document.getElementById('purchaseDate');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const inputSection = document.getElementById('inputSection');
        const resultSection = document.getElementById('resultSection');
        const contentContainer = document.getElementById('contentContainer');

        // Set max date to today
        purchaseDate.max = new Date().toISOString().split('T')[0];

        // Initialize
        function init() {
            // Navigation
            backBtn.addEventListener('click', () => {
                window.location.href = 'home.html';
            });
            nav1.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav3.addEventListener('click', () => {
                window.location.href = 'index3.html';
            });

            // Image Upload
            imageUploadArea.addEventListener('click', () => {
                fileInput.click();
            });
            fileInput.addEventListener('change', handleImageSelect);
            fileInputHidden.addEventListener('change', handleImageSelect);
            removeImageBtn.addEventListener('click', removeImage);

            // Date Input
            purchaseDate.addEventListener('change', updateAnalyzeButton);

            // Analyze Button
            analyzeBtn.addEventListener('click', startAnalysis);
        }

        // Handle Image Selection
        function handleImageSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    state.selectedImage = { data: event.target.result, file: file };
                    showImagePreview(event.target.result);
                    updateAnalyzeButton();
                };
                reader.readAsDataURL(file);
            }
        }

        // Show Image Preview
        function showImagePreview(imageData) {
            previewImage.src = imageData;
            uploadPlaceholder.style.display = 'none';
            imagePreview.style.display = 'block';
            imageUploadArea.classList.add('has-image');
        }

        // Remove Image
        function removeImage(e) {
            e.stopPropagation();
            state.selectedImage = null;
            uploadPlaceholder.style.display = 'flex';
            imagePreview.style.display = 'none';
            imageUploadArea.classList.remove('has-image');
            fileInput.value = '';
            fileInputHidden.value = '';
            updateAnalyzeButton();
        }

        // Update Analyze Button State
        function updateAnalyzeButton() {
            analyzeBtn.disabled = !state.selectedImage || !purchaseDate.value;
        }

        // Start Analysis
        async function startAnalysis() {
            if (state.isLoading || !state.selectedImage || !purchaseDate.value) return;
            
            state.isLoading = true;
            showLoadingState();
            
            try {
                const result = await callDoubaoAPI();
                showResult(result);
            } catch (error) {
                console.error('Analysis error:', error);
                showError(error.message);
            } finally {
                state.isLoading = false;
            }
        }

        // Show Loading State
        function showLoadingState() {
            analyzeBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation: spin 1s linear infinite;">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>分析中...</span>
            `;
            analyzeBtn.disabled = true;
        }

        // Call Doubao API
        async function callDoubaoAPI() {
            const systemPrompt = `你是一个有趣的消费人格分析师。

任务：
1. 识别图片中的电子产品型号
2. 根据购买时间，生成一个消费人格诊断

消费人格类型（根据购买时机随机或根据真实规律）：
- 🛡️ 等等党元帅 - 买在历史最低点，性价比之王
- ⚡ 首发冲锋勇士 - 为信仰充值，可能溢价购买
- 📉 电子接盘侠 - 买在山顶，站岗中
- 🔧 理性参数党 - 研究透彻，理性入手
- 💰 赛博貔貅 - 买了就不卖，理财产品

请以JSON格式返回：
{
  "deviceModel": "识别到的产品型号",
  "personality": "人格称号",
  "avatar": "emoji表情",
  "description": "有趣的描述，100字以内",
  "premiumRate": "溢价率或折扣率（如+37%、-20%）"
}`;

            const messages = [
                { role: 'system', content: systemPrompt },
                { 
                    role: 'user', 
                    content: [
                        { type: 'text', text: `购买时间：${purchaseDate.value}` },
                        { type: 'image_url', image_url: { url: state.selectedImage.data } }
                    ]
                }
            ];

            const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                },
                body: JSON.stringify({
                    model: state.modelId,
                    messages: messages,
                    stream: false,
                    temperature: 0.8
                })
            });

            if (!response.ok) {
                throw new Error('API 请求失败');
            }

            const data = await response.json();
            let content = data.choices[0].message.content;
            
            try {
                content = content.replace(/```json|```/g, '').trim();
                return JSON.parse(content);
            } catch {
                return {
                    deviceModel: "未知设备",
                    personality: "神秘消费客",
                    avatar: "🎭",
                    description: "你的消费风格让人捉摸不透，保持神秘！",
                    premiumRate: "?"
                };
            }
        }

        // Show Result
        function showResult(result) {
            inputSection.style.display = 'none';
            resultSection.style.display = 'block';
            
            resultSection.innerHTML = `
                <h1 class="page-title">诊断结果</h1>
                <div class="result-card">
                    <div class="result-content">
                        <div class="personality-avatar">${result.avatar}</div>
                        <h2 class="personality-title">${result.personality}</h2>
                        <div class="device-info">
                            📱 ${result.deviceModel}<br>
                            <span style="color: ${result.premiumRate.includes('+') ? '#f87171' : '#4ade80'}">${result.premiumRate}</span>
                        </div>
                        <p class="personality-description">${result.description}</p>
                        <div class="share-section">
                            <p class="share-hint">看看你是什么成分？</p>
                            <button class="share-btn" id="shareBtn">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <polyline points="16 6 12 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="12" y1="2" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>截图分享</span>
                            </button>
                            <button class="retry-btn" id="retryBtn">再测一次</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('retryBtn').addEventListener('click', resetToInput);
            document.getElementById('shareBtn').addEventListener('click', () => {
                alert('请使用手机截图功能分享结果！');
            });
        }

        // Show Error
        function showError(message) {
            analyzeBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>开始诊断</span>
            `;
            updateAnalyzeButton();
            alert('分析失败：' + message);
        }

        // Reset to Input
        function resetToInput() {
            resultSection.style.display = 'none';
            inputSection.style.display = 'block';
            analyzeBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>开始诊断</span>
            `;
            updateAnalyzeButton();
        }

        // Initialize app
        init();
    </script>
</body>
</html>
