<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 性价比排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 16px 20px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 44px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #44c7ff 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(64, 156, 255, 0.22);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.18));
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            white-space: nowrap;
            background: linear-gradient(90deg, #8b5cf6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 18px 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .page-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 8px;
        }

        .page-subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.6;
            margin-bottom: 2px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .field:first-child {
            margin-top: 0;
        }

        .field-label {
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.92);
        }

        .text-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 15px;
            outline: none;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .chip-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
        }

        .chip {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 6px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            flex: 1 1 0;
            min-width: 0;
            text-align: center;
            white-space: nowrap;
        }

        .chip:hover {
            border-color: rgba(168, 85, 247, 0.5);
        }

        .chip.active {
            background: rgba(168, 85, 247, 0.18);
            border-color: rgba(168, 85, 247, 0.65);
            color: rgba(255, 255, 255, 0.96);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn.primary {
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #06b6d4 100%);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .segmented {
            display: flex;
            gap: 10px;
        }

        .segment {
            flex: 1;
            padding: 10px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }

        .segment.active {
            background: rgba(6, 182, 212, 0.18);
            border-color: rgba(6, 182, 212, 0.6);
            color: rgba(255, 255, 255, 0.96);
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .badge {
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.82);
            font-weight: 800;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .row {
            display: grid;
            grid-template-columns: 36px 1fr;
            gap: 12px;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .rank {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.94);
            background: rgba(168, 85, 247, 0.18);
            border: 1px solid rgba(168, 85, 247, 0.35);
        }

        .row-title {
            font-size: 14px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.35;
        }

        .row-sub {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.76);
        }

        .pill {
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.18);
            font-weight: 800;
        }

        .pill.good {
            background: rgba(34, 197, 94, 0.14);
            border-color: rgba(34, 197, 94, 0.35);
            color: rgba(255, 255, 255, 0.92);
        }

        .pill.bad {
            background: rgba(248, 113, 113, 0.14);
            border-color: rgba(248, 113, 113, 0.35);
            color: rgba(255, 255, 255, 0.92);
        }

        .loading {
            display: none;
            gap: 14px;
            align-items: center;
            justify-content: center;
            padding: 22px 18px;
            color: rgba(255, 255, 255, 0.82);
            font-weight: 800;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #a855f7;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <defs>
                                <linearGradient id="pl_logo_left" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
                                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.86"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_right" x1="1" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#eef2ff" stop-opacity="0.92"/>
                                    <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.78"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_base" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
                                </linearGradient>
                            </defs>
                            <polygon points="50,8 12,78 50,92" fill="url(#pl_logo_left)"/>
                            <polygon points="50,8 50,92 88,78" fill="url(#pl_logo_right)"/>
                            <polygon points="12,78 50,92 88,78" fill="url(#pl_logo_base)"/>
                        </svg>
                    </div>
                    <div class="brand-name">PriceLens</div>
                </div>
                <div class="status-dot"></div>
            </div>
        </div>

        <div class="content">
            <div class="page-title">性价比排行榜</div>
            <div class="page-subtitle">输入你的心理价，模型查询当前真实价<br>按“惊喜程度”给出超值榜/溢价榜</div>

            <div class="card">
                <div class="field">
                    <div class="field-label">你的心理价（元）</div>
                    <input class="text-input" id="expectedPrice" inputmode="numeric" placeholder="例如：3999">
                </div>

                <div class="field">
                    <div class="field-label">品类</div>
                    <div class="option-grid" id="categoryGrid"></div>
                </div>

                <div class="field">
                    <div class="field-label">关键词（可选）</div>
                    <input class="text-input" id="keywordInput" placeholder="例如：小屏手机 / 轻薄本 / 降噪耳机">
                </div>

                <div class="field">
                    <div class="field-label">关注点（可多选）</div>
                    <div class="chip-row" id="focusRow"></div>
                </div>

                <div class="actions">
                    <button class="btn" id="resetBtn" type="button">重置</button>
                    <button class="btn primary" id="generateBtn" type="button" disabled>生成榜单</button>
                </div>
            </div>

            <div class="card" id="resultCard" style="display:none;">
                <div class="segmented">
                    <button class="segment active" id="segValue" type="button">超值榜</button>
                    <button class="segment" id="segOverpay" type="button">溢价榜</button>
                </div>
                <div class="summary" id="summaryRow"></div>
                <div class="loading" id="loadingRow">
                    <div class="spinner"></div>
                    <div>生成中...</div>
                </div>
                <div class="list" id="list"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" id="nav1">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 7a1 1 0 0 1 1 1v1.2l1.1-.7a1 1 0 1 1 1.06 1.7L13 13v1a1 1 0 1 1-2 0v-1l-2.16-1.8A1 1 0 1 1 9.9 9.7l1.1.7V8a1 1 0 0 1 1-1zm7 3a1 1 0 0 1 1 1c0 5-4.03 9-9 9s-9-4-9-9a1 1 0 1 1 2 0c0 3.87 3.14 7 7 7s7-3.13 7-7a1 1 0 0 1 1-1z"/>
                </svg>
                <span>刷视频</span>
            </div>
            <div class="nav-item" id="nav2">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>咨询</span>
            </div>
            <div class="nav-item active" id="nav3">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 19a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4zm7 0a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-2zm7 0a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2z"/>
                </svg>
                <span>排行榜</span>
            </div>
            <div class="nav-item" id="nav4">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <script>
        const DEFAULT_DOUBAO_API_KEY = 'ark-0a58b840-8bb3-4c90-8528-413397e9be41-de715';
        const DEFAULT_DOUBAO_MODEL_ID = 'ep-20260526170456-nrqxz';

        const state = {
            apiKey: localStorage.getItem('doubao_api_key') || DEFAULT_DOUBAO_API_KEY,
            modelId: localStorage.getItem('doubao_model_id') || DEFAULT_DOUBAO_MODEL_ID,
            expectedPrice: 0,
            category: '',
            keyword: '',
            focus: [],
            mode: 'value',
            products: []
        };

        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');
        const nav4 = document.getElementById('nav4');

        const expectedPriceInput = document.getElementById('expectedPrice');
        const categoryGrid = document.getElementById('categoryGrid');
        const keywordInput = document.getElementById('keywordInput');
        const focusRow = document.getElementById('focusRow');
        const resetBtn = document.getElementById('resetBtn');
        const generateBtn = document.getElementById('generateBtn');
        const resultCard = document.getElementById('resultCard');
        const segValue = document.getElementById('segValue');
        const segOverpay = document.getElementById('segOverpay');
        const summaryRow = document.getElementById('summaryRow');
        const loadingRow = document.getElementById('loadingRow');
        const listEl = document.getElementById('list');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function safeJsonParse(raw) {
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function setMode(nextMode) {
            state.mode = nextMode;
            segValue.classList.toggle('active', nextMode === 'value');
            segOverpay.classList.toggle('active', nextMode === 'overpay');
            renderList();
        }

        function setLoading(loading) {
            loadingRow.style.display = loading ? 'flex' : 'none';
            generateBtn.disabled = loading || !isFormReady();
            resetBtn.disabled = loading;
        }

        function isFormReady() {
            return Number.isFinite(state.expectedPrice) && state.expectedPrice > 0 && !!state.category;
        }

        function updateGenerateBtn() {
            generateBtn.disabled = !isFormReady();
        }

        function buildChips(container, items, { multiKey, singleKey } = {}) {
            container.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'chip';
                btn.textContent = item;
                btn.addEventListener('click', () => {
                    if (multiKey) {
                        const list = state[multiKey] || [];
                        const idx = list.indexOf(item);
                        if (idx >= 0) list.splice(idx, 1);
                        else list.push(item);
                        state[multiKey] = list;
                        btn.classList.toggle('active', state[multiKey].includes(item));
                    } else if (singleKey) {
                        state[singleKey] = item;
                        Array.from(container.children).forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                        updateGenerateBtn();
                    }
                });
                container.appendChild(btn);
            });
        }

        function normalizeCategoryLabel(label) {
            return String(label || '')
                .replace(/^📱\s*/, '手机')
                .replace(/^💻\s*/, '电脑')
                .replace(/^📟\s*/, '平板')
                .replace(/^🎧\s*/, '耳机')
                .replace(/^⌚\s*/, '手表')
                .replace(/^🧩\s*/, '其他');
        }

        function scoreProducts(products, expectedPrice) {
            const base = expectedPrice;
            return products.map(p => {
                const real = Number(p.currentPrice || p.realPrice || 0);
                const fit = Number(p.fit || 1);
                const safeFit = Number.isFinite(fit) ? Math.max(0.6, Math.min(1.1, fit)) : 1;
                const gap = base - real;
                const gapRate = base > 0 ? gap / base : 0;
                const score = gapRate * 100;
                const finalScore = score * safeFit;
                return {
                    name: String(p.name || p.model || '').trim(),
                    currentPrice: Number.isFinite(real) ? Math.round(real) : 0,
                    fit: safeFit,
                    reason: String(p.reason || p.note || '').trim(),
                    gap,
                    gapRate,
                    score,
                    finalScore
                };
            }).filter(p => p.name && p.currentPrice > 0);
        }

        function renderSummary() {
            summaryRow.innerHTML = '';
            const badges = [
                `心理价：${state.expectedPrice}元`,
                `品类：${normalizeCategoryLabel(state.category)}`,
                state.keyword ? `关键词：${state.keyword}` : '',
                state.focus.length > 0 ? `关注：${state.focus.join('、')}` : ''
            ].filter(Boolean);
            summaryRow.innerHTML = badges.map(t => `<div class="badge">${escapeHtml(t)}</div>`).join('');
        }

        function renderList() {
            listEl.innerHTML = '';
            if (!Array.isArray(state.products) || state.products.length === 0) return;

            const sorted = [...state.products].sort((a, b) => {
                if (state.mode === 'overpay') return a.finalScore - b.finalScore;
                return b.finalScore - a.finalScore;
            });

            sorted.slice(0, 10).forEach((p, idx) => {
                const gapText = `${p.gap >= 0 ? '便宜' : '贵了'}${Math.abs(Math.round(p.gap))}元`;
                const ratePct = Math.round(p.gapRate * 100);
                const pillClass = p.finalScore >= 0 ? 'good' : 'bad';
                const scoreText = `${p.finalScore >= 0 ? '+' : ''}${Math.round(p.finalScore)}分`;

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `
                    <div class="rank">${idx + 1}</div>
                    <div>
                        <div class="row-title">${escapeHtml(p.name)}</div>
                        <div class="row-sub">
                            <div class="pill">真实价 ${escapeHtml(String(p.currentPrice))}元</div>
                            <div class="pill">${escapeHtml(gapText)}</div>
                            <div class="pill ${pillClass}">${escapeHtml(scoreText)}</div>
                            <div class="pill">${escapeHtml(String(ratePct))}%</div>
                        </div>
                        ${p.reason ? `<div class="row-sub" style="margin-top:10px;"><span style="opacity:0.85;">${escapeHtml(p.reason)}</span></div>` : ''}
                    </div>
                `;
                row.addEventListener('click', () => {
                    localStorage.setItem('prefillText', `我想了解${p.name}现在值不值得买。我的心理价是${state.expectedPrice}元，你估算的真实价是${p.currentPrice}元，请给我购买建议和替代选择。`);
                    window.location.href = 'index.html';
                });
                listEl.appendChild(row);
            });
        }

        async function callDoubaoAPI(messages, temperature = 0.7) {
            state.apiKey = localStorage.getItem('doubao_api_key') || DEFAULT_DOUBAO_API_KEY;
            state.modelId = localStorage.getItem('doubao_model_id') || DEFAULT_DOUBAO_MODEL_ID;
            if (!state.apiKey || !state.modelId) {
                throw new Error('缺少 API Key 或 Model ID。请先在咨询页设置。');
            }

            const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                },
                body: JSON.stringify({
                    model: state.modelId,
                    messages,
                    stream: false,
                    temperature
                })
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.error?.message || `API 请求失败 (${response.status})`);
            }

            const data = await response.json();
            return data.choices[0].message.content || '';
        }

        async function generateRank() {
            if (!isFormReady()) return;
            resultCard.style.display = 'block';
            renderSummary();
            setLoading(true);
            listEl.innerHTML = '';
            state.products = [];

            try {
                const category = normalizeCategoryLabel(state.category);
                const keyword = String(state.keyword || '').trim();
                const focus = state.focus.length > 0 ? state.focus.join('、') : '无';
                const expected = state.expectedPrice;

                const systemPrompt = [
                    '你是 PriceLens 的性价比排行榜引擎。',
                    '目标：根据用户输入的品类与关键词，给出10个候选产品，并估算每个产品“当前真实价格”。',
                    '输出必须为严格 JSON，不要markdown，不要多余文字。',
                    '规则：',
                    '1) currentPrice 必须是单个整数（元），禁止范围/区间/波动描述。',
                    '2) 产品要尽量覆盖不同价位段，但应尽量围绕用户心理价附近（上下浮动合理即可）。',
                    '3) reason 一句话解释为什么这个价格/为什么可能更划算（例如渠道补贴、上一代、清库存、配置差异等），不要超过20字。',
                    '4) fit 为0.6到1.1之间的小数，表示对用户关注点的匹配度；如果无法判断就给1。',
                    'JSON格式：',
                    '{"products":[{"name":"...","currentPrice":1234,"fit":1.0,"reason":"..."}]}'
                ].join('\n');

                const userPrompt = [
                    `今天时间：2026年5月底`,
                    `品类：${category}`,
                    `关键词：${keyword || '无'}`,
                    `用户关注点：${focus}`,
                    `用户心理价：${expected}元`
                ].join('\n');

                const raw = await callDoubaoAPI(
                    [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ],
                    0.75
                );

                const cleaned = String(raw).replace(/```json|```/g, '').trim();
                const parsed = safeJsonParse(cleaned);
                const products = parsed && Array.isArray(parsed.products) ? parsed.products : [];
                state.products = scoreProducts(products, expected);
                renderList();
            } catch (e) {
                alert('生成失败：' + (e && e.message ? e.message : '未知错误'));
            } finally {
                setLoading(false);
            }
        }

        function resetForm() {
            state.expectedPrice = 0;
            state.category = '';
            state.keyword = '';
            state.focus = [];
            expectedPriceInput.value = '';
            keywordInput.value = '';
            Array.from(categoryGrid.children).forEach(c => c.classList.remove('active'));
            Array.from(focusRow.children).forEach(c => c.classList.remove('active'));
            resultCard.style.display = 'none';
            state.products = [];
            updateGenerateBtn();
        }

        function init() {
            nav1.addEventListener('click', () => {
                window.location.href = 'feed.html';
            });
            nav2.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav3.addEventListener('click', () => {
                window.location.href = 'rank.html';
            });
            nav4.addEventListener('click', () => {
                window.location.href = 'index2.html';
            });

            buildChips(categoryGrid, ['📱 手机', '💻 电脑', '📟 平板', '🎧 耳机', '⌚ 手表', '🧩 其他'], { singleKey: 'category' });
            buildChips(focusRow, ['性能', '续航', '影像', '屏幕', '轻薄', '保值'], { multiKey: 'focus' });

            expectedPriceInput.addEventListener('input', () => {
                const v = String(expectedPriceInput.value || '').replace(/[^\d]/g, '');
                expectedPriceInput.value = v;
                state.expectedPrice = v ? parseInt(v, 10) : 0;
                updateGenerateBtn();
            });

            keywordInput.addEventListener('input', () => {
                state.keyword = keywordInput.value.trim();
            });

            resetBtn.addEventListener('click', resetForm);
            generateBtn.addEventListener('click', generateRank);
            segValue.addEventListener('click', () => setMode('value'));
            segOverpay.addEventListener('click', () => setMode('overpay'));
            updateGenerateBtn();
        }

        init();
    </script>
</body>
</html>
