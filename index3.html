<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 等等轮盘赌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUv8lqGk9bIosQn_Se3xWMHpj8E6TI4QACLSEAAkjl2VRuphXOjwLfTDsE.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Back Button */
        .back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Content Container */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .content-container.product-selection {
            padding-bottom: 3mm;
        }

        .content-container.product-selection .refresh-btn {
            margin-top: auto;
            width: 66.67%;
            min-height: 96px;
            align-self: center;
            margin-bottom: 6px;
        }

        .content-container::-webkit-scrollbar {
            width: 4px;
        }

        .content-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .page-subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        /* Product Cards */
        .products-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(168, 85, 247, 0.5);
        }

        .product-card.selected {
            border-color: #a855f7;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(6, 182, 212, 0.1));
        }

        .product-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .product-emoji {
            font-size: 28px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .product-price {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Refresh Button */
        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Strategy Buttons */
        .strategy-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .strategy-btn {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .strategy-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(168, 85, 247, 0.5);
        }

        .strategy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Draw Animation */
        .draw-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 28px 16px;
        }

        .roulette {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(6, 182, 212, 0.3) 100%);
            border: 3px solid rgba(168, 85, 247, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            animation: spin 0.5s linear infinite;
        }

        .draw-text {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 28px 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result Card */
        .result-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(6, 182, 212, 0.2));
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-message {
            font-size: 16px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .play-again-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #06b6d4 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .play-again-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="返回首页">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="brand">
                    <div class="brand-logo"></div>
                    <div class="brand-name">PriceLens</div>
                </div>
                <div class="status-dot"></div>
            </div>
        </div>

        <!-- Content Container -->
        <div class="content-container" id="contentContainer">
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item" id="nav1">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>咨询</span>
            </div>
            <div class="nav-item" id="nav2">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>人格诊断</span>
            </div>
            <div class="nav-item active" id="nav3">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <span>轮盘赌</span>
            </div>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <script>
        // App State
        const state = {
            apiKey: localStorage.getItem('doubao_api_key') || 'ark-0a58b840-8bb3-4c90-8528-413397e9be41-de715',
            modelId: localStorage.getItem('doubao_model_id') || 'apikey-20260526164024-jtmz7',
            products: [],
            selectedProduct: null,
            isLoading: false,
            gameStep: 'select-product' // 'select-product', 'select-strategy', 'loading', 'result'
        };

        // DOM Elements
        const backBtn = document.getElementById('backBtn');
        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');
        const contentContainer = document.getElementById('contentContainer');

        // System Prompt for Doubao
        const systemPrompt = `你是一个专门为"等等轮盘赌"趣味博弈游戏生成内容的AI助手。你的任务是生成以下两类内容，且始终返回合法的 JSON 格式。

## 任务1：生成产品列表（当用户需要"换一批"时）
生成3个当前热门电子产品（不要有虚拟的、未发售的产品如iphone18；顺序要随机，每次三个），初始的emoji图标：手机📱，电脑和平板电脑💻，手表⌚，键盘⌨️，鼠标🖱️，耳机🎧，游戏机🎮，相机📷，不要乱设置。产品类型也为这八种。
每个产品包含：
- name: 产品名称（例如"iPhone 15"、"PS5"、"AirPods Pro 2"）
- price: 搜索到的当前市场价格（整数，单位：元，价格需合理，如手机4000~10000，耳机1000~2500，游戏机2000~6000）

输出格式：
{
  "products": [
    { "name": "产品A", "price": 5999 },
    { "name": "产品B", "price": 3999 }
  ]
}

## 任务2：根据用户选择的策略（现在买 / 等1个月 / 等3个月）以及当前选中的产品，生成输赢结果
输入信息包括：
- product_name: 产品名称
- current_price: 当前价格（元）
- strategy: 策略选项（"now" / "1month" / "3month"）

你需要生成：
- 考虑性价比变化：在 message 文案中，不仅要说出价格涨跌，还要用一句话说明性价比的变化（如"虽然没降价，但新款发布旧款依然能打，性价比反而更高"或"涨价后性价比暴跌"）。
- win: 布尔值，true表示用户赚了（价格下降或持平），false表示用户亏了（价格上涨）
- message: 一句中文文案，生动有趣，包含具体产品、等待时长、价格变化以及一个生活化的类比（如"省下的钱能吃顿火锅"、"多花的钱等于两杯奶茶"等）。若 win=true 则表达恭喜与赚到，若 win=false 则表达遗憾。

额外要求：
- 赚或亏的标准（你需要预测数据，而不是完全随机）：不要每次结果都相同，根据策略时长，现在买可能处于历史高价或低价，但也要体现时间价值；等1个月应比现在买有较低概率涨价，但可能因新品预告小幅降价；等3个月大概率降价或受迭代影响（新款发布则旧款降价，缺货则涨价），且结果中应随机体现"更新换代"带来的性价比波动，等3个月风险与机遇并存，但总体保持趣味博弈感。
- 文案风格：轻松、幽默、带 emoji，适合年轻用户。

输出格式：
{
  "win": true,
  "message": "恭喜！你等1个月后 iPhone 15 价格降了200元，省下的钱能吃顿火锅🍲"
}

## 重要规则
- 只返回纯 JSON 对象，不要包含任何额外解释或文字。
- 确保价格变化合理，不与现实严重脱节。
- 每个请求独立随机生成，不要记忆历史。
- 现在的时间：2026年5月底
- 不需要深度思考模式`;

        // Initialize
        function init() {
            // Navigation
            backBtn.addEventListener('click', () => {
                window.location.href = 'home.html';
            });
            nav1.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav2.addEventListener('click', () => {
                window.location.href = 'index2.html';
            });

            // Load initial products
            loadProducts();
        }

        // Load products from Doubao API
        async function loadProducts() {
            state.isLoading = true;
            renderLoadingState('加载产品中...');

            try {
                const messages = [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: '请生成3个热门电子产品列表' }
                ];

                const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiKey}`
                    },
                    body: JSON.stringify({
                        model: state.modelId,
                        messages: messages,
                        stream: false,
                        temperature: 0.8
                    })
                });

                if (!response.ok) {
                    throw new Error('API 请求失败');
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                content = content.replace(/```json|```/g, '').trim();
                const result = JSON.parse(content);
                
                state.products = result.products;
                state.selectedProduct = null;
                state.gameStep = 'select-product';
                renderProductSelection();
            } catch (error) {
                console.error('Load products error:', error);
                // Fallback to dummy products
                state.products = [
                    { name: 'iPhone 15', price: 5999 },
                    { name: 'PlayStation 5', price: 3899 },
                    { name: 'AirPods Pro 2', price: 1899 }
                ];
                state.selectedProduct = null;
                state.gameStep = 'select-product';
                renderProductSelection();
            } finally {
                state.isLoading = false;
            }
        }

        // Get emoji for product
        function getProductEmoji(productName) {
            const name = productName.toLowerCase();
            if (name.includes('iphone') || name.includes('手机')) return '📱';
            if (name.includes('mac') || name.includes('ipad') || name.includes('电脑') || name.includes('平板')) return '💻';
            if (name.includes('watch') || name.includes('手表')) return '⌚';
            if (name.includes('keyboard') || name.includes('键盘')) return '⌨️';
            if (name.includes('mouse') || name.includes('鼠标')) return '🖱️';
            if (name.includes('airpods') || name.includes('耳机')) return '🎧';
            if (name.includes('playstation') || name.includes('xbox') || name.includes('switch') || name.includes('游戏机')) return '🎮';
            if (name.includes('camera') || name.includes('相机')) return '📷';
            return '📱';
        }

        // Render product selection
        function renderProductSelection() {
            contentContainer.className = 'content-container product-selection';
            contentContainer.innerHTML = `
                <h1 class="page-title">🎰 等等轮盘赌</h1>
                <p class="page-subtitle">选择一个产品，看看怎么买最划算！</p>
                
                <div class="products-container">
                    ${state.products.map((product, index) => `
                        <div class="product-card ${state.selectedProduct === index ? 'selected' : ''}" 
                             data-index="${index}">
                            <div class="product-header">
                                <span class="product-emoji">${getProductEmoji(product.name)}</span>
                                <span class="product-name">${product.name}</span>
                            </div>
                            <div class="product-price">¥${product.price}</div>
                        </div>
                    `).join('')}
                </div>

                <button class="refresh-btn" id="refreshBtn">
                    🔄 换一批
                </button>
            `;

            // Add event listeners
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', () => {
                    const index = parseInt(card.dataset.index);
                    state.selectedProduct = index;
                    state.gameStep = 'select-strategy';
                    renderStrategySelection();
                });
            });

            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.addEventListener('click', () => {
                if (!state.isLoading) {
                    loadProducts();
                }
            });
        }

        // Render strategy selection
        function renderStrategySelection() {
            contentContainer.className = 'content-container';
            const product = state.products[state.selectedProduct];
            contentContainer.innerHTML = `
                <h1 class="page-title">🎰 等等轮盘赌</h1>
                <p class="page-subtitle">你选择了：${product.name}（¥${product.price}）</p>
                
                <div class="strategy-container">
                    <div class="product-card strategy-btn" id="nowBtn">
                        <div class="product-header">
                            <span class="product-emoji">🟢</span>
                            <span class="product-name">现在买</span>
                        </div>
                    </div>
                    <div class="product-card strategy-btn" id="oneMonthBtn">
                        <div class="product-header">
                            <span class="product-emoji">🟡</span>
                            <span class="product-name">等1个月</span>
                        </div>
                    </div>
                    <div class="product-card strategy-btn" id="threeMonthsBtn">
                        <div class="product-header">
                            <span class="product-emoji">🔴</span>
                            <span class="product-name">等3个月</span>
                        </div>
                    </div>
                </div>
            `;

            // Add event listeners
            document.getElementById('nowBtn').addEventListener('click', () => {
                playGame('now');
            });
            document.getElementById('oneMonthBtn').addEventListener('click', () => {
                playGame('1month');
            });
            document.getElementById('threeMonthsBtn').addEventListener('click', () => {
                playGame('3month');
            });
        }

        // Play the game
        async function playGame(strategy) {
            state.isLoading = true;
            state.gameStep = 'loading';
            renderDrawAnimation();

            try {
                const product = state.products[state.selectedProduct];
                const userMessage = JSON.stringify({
                    product_name: product.name,
                    current_price: product.price,
                    strategy: strategy
                });

                const messages = [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userMessage }
                ];

                // First show animation for 2 seconds
                await new Promise(resolve => setTimeout(resolve, 2000));

                const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiKey}`
                    },
                    body: JSON.stringify({
                        model: state.modelId,
                        messages: messages,
                        stream: false,
                        temperature: 0.8
                    })
                });

                if (!response.ok) {
                    throw new Error('API 请求失败');
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                content = content.replace(/```json|```/g, '').trim();
                const result = JSON.parse(content);
                
                state.gameStep = 'result';
                renderResult(result);
            } catch (error) {
                console.error('Play game error:', error);
                // Fallback to dummy result
                const product = state.products[state.selectedProduct];
                state.gameStep = 'result';
                renderResult({
                    win: Math.random() > 0.5,
                    message: `关于 ${product.name} 的购买决策结果！`
                });
            } finally {
                state.isLoading = false;
            }
        }

        // Render loading state
        function renderLoadingState(text) {
            contentContainer.className = 'content-container';
            contentContainer.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="color: rgba(255, 255, 255, 0.8); font-size: 16px;">${text}</p>
                </div>
            `;
        }

        // Render draw animation
        function renderDrawAnimation() {
            contentContainer.className = 'content-container';
            contentContainer.innerHTML = `
                <div class="draw-container">
                    <div class="roulette">🎰</div>
                    <p class="draw-text">正在开奖……</p>
                </div>
            `;
        }

        // Render result
        function renderResult(result) {
            contentContainer.className = 'content-container';
            const product = state.products[state.selectedProduct];
            contentContainer.innerHTML = `
                <h1 class="page-title">🎰 开奖结果</h1>
                
                <div class="result-card">
                    <div class="result-icon">${result.win ? '🎉' : '😢'}</div>
                    <p class="result-message">${result.message}</p>
                    <button class="play-again-btn" id="playAgainBtn">
                        🎮 再来一局
                    </button>
                </div>
            `;

            document.getElementById('playAgainBtn').addEventListener('click', () => {
                state.selectedProduct = null;
                state.gameStep = 'select-product';
                renderProductSelection();
            });
        }

        // Initialize app
        init();
    </script>
</body>
</html>
