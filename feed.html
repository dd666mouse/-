<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 刷视频</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 16px 20px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 44px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #44c7ff 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(64, 156, 255, 0.22);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.18));
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            white-space: nowrap;
            background: linear-gradient(90deg, #8b5cf6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }

        .feed::-webkit-scrollbar {
            width: 4px;
        }

        .feed::-webkit-scrollbar-track {
            background: transparent;
        }

        .feed::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .masonry {
            column-count: 2;
            column-gap: 12px;
        }

        .tile {
            break-inside: avoid;
            margin-bottom: 12px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(15, 15, 26, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .tile img,
        .tile video {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .tile-cover,
        .tile-fallback {
            width: 100%;
            aspect-ratio: 9 / 16;
        }

        .tile-cover {
            background: rgba(255, 255, 255, 0.04);
        }

        .tile-fallback {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px;
            background:
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.45), transparent 42%),
                radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.22), transparent 36%),
                linear-gradient(160deg, #0f172a 0%, #111c44 48%, #1d0f38 100%);
        }

        .tile-fallback.variant-1 {
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.52), transparent 38%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.42), transparent 42%),
                linear-gradient(160deg, #10204f 0%, #101a44 46%, #24104d 100%);
        }

        .tile-fallback.variant-2 {
            background:
                radial-gradient(circle at top right, rgba(244, 114, 182, 0.46), transparent 36%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.42), transparent 40%),
                linear-gradient(160deg, #27164a 0%, #162357 52%, #111827 100%);
        }

        .tile-fallback.variant-3 {
            background:
                radial-gradient(circle at top center, rgba(45, 212, 191, 0.46), transparent 32%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.46), transparent 44%),
                linear-gradient(160deg, #0f1f3b 0%, #132a5b 52%, #27104b 100%);
        }

        .tile-fallback-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .tile-fallback-play {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }

        .tile-fallback-play::before {
            content: '';
            width: 0;
            height: 0;
            margin-left: 4px;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 14px solid rgba(255, 255, 255, 0.96);
        }

        .tile-fallback-copy {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 86%;
        }

        .tile-fallback-title {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.3;
            color: #ffffff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.22);
        }

        .tile-fallback-sub {
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        }

        .tile-shade {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 12px 10px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.65) 100%);
        }

        .tile-title {
            font-size: 13px;
            font-weight: 900;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
            line-height: 1.35;
        }

        .tile-sub {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.45;
        }

        .tile-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 15, 26, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }

        .viewer-progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
        }

        .viewer {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: none;
            background: rgba(0,0,0,0.35);
        }

        .viewer-inner {
            position: absolute;
            inset: 0;
            max-width: 430px;
            margin: 0 auto;
        }

        .frame {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            margin: 14px;
            overflow: hidden;
            background: rgba(15, 15, 26, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .frame-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.08) contrast(1.05);
            transform: translateZ(0);
        }

        .frame-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.12) 45%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .hint {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            z-index: 5;
            pointer-events: auto;
        }

        .hint-badge {
            background: rgba(15, 15, 26, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            cursor: pointer;
        }

        .hint-badge.primary {
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            color: rgba(255, 255, 255, 0.96);
            font-weight: 900;
        }

        .caption {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            z-index: 2;
        }

        .caption-title {
            font-size: 18px;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .caption-sub {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.82);
            line-height: 1.5;
        }

        .viewer-progress {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 92px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            overflow: hidden;
            z-index: 4;
            cursor: pointer;
            touch-action: none;
        }

        .viewer-progress-fill {
            position: relative;
        }

        .viewer-progress-thumb {
            position: absolute;
            top: 50%;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.28);
            transform: translate(50%, -50%);
        }

        .gesture-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
        }

        .select-layer {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 4;
            background: rgba(0,0,0,0.18);
        }

        .select-topbar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .select-tip {
            flex: 1;
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            background: rgba(15, 15, 26, 0.55);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 12px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
        }

        .select-btn {
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.9);
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .select-btn.primary {
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
        }

        .select-rect {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            box-shadow: 0 12px 34px rgba(0,0,0,0.35);
            background: rgba(255,255,255,0.06);
        }

        .select-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.15);
        }

        .handle-tl { top: -9px; left: -9px; }
        .handle-tr { top: -9px; right: -9px; }
        .handle-bl { bottom: -9px; left: -9px; }
        .handle-br { bottom: -9px; right: -9px; }

        .preview-modal {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 6;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,0.35);
        }

        .modal-card {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            background: rgba(15, 15, 26, 0.96);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 18px 16px 16px;
            backdrop-filter: blur(20px);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 900;
            color: rgba(255,255,255,0.95);
        }

        .modal-sub {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        .modal-preview {
            margin-top: 14px;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
        }

        .modal-preview img {
            width: 100%;
            display: block;
        }

        .modal-actions {
            margin-top: 14px;
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
            border-radius: 16px;
            padding: 14px 12px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
        }

        .modal-actions button.primary {
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #06b6d4 100%);
        }

        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="返回首页">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="brand">
                    <div class="brand-logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <defs>
                                <linearGradient id="pl_logo_left" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
                                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.86"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_right" x1="1" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#eef2ff" stop-opacity="0.92"/>
                                    <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.78"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_base" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
                                </linearGradient>
                            </defs>
                            <polygon points="50,8 12,78 50,92" fill="url(#pl_logo_left)"/>
                            <polygon points="50,8 50,92 88,78" fill="url(#pl_logo_right)"/>
                            <polygon points="12,78 50,92 88,78" fill="url(#pl_logo_base)"/>
                        </svg>
                    </div>
                    <div class="brand-name">PriceLens</div>
                </div>
                <div class="status-dot"></div>
            </div>
        </div>

        <div class="feed">
            <div class="masonry" id="masonry"></div>
        </div>

        <div class="viewer" id="viewer">
            <div class="viewer-inner">
                <div class="frame" id="frame">
                    <video id="frameVideo" class="frame-media" muted playsinline preload="metadata" loop autoplay></video>
                    <div class="frame-shade"></div>
                    <div class="hint" id="viewerHint">
                        <div class="hint-badge" id="closeViewerBtn">返回</div>
                        <div class="hint-badge">长按或点按钮选框</div>
                        <div class="hint-badge primary" id="openSelectBtn">选框识别</div>
                    </div>
                    <div class="caption">
                        <div class="caption-title" id="captionTitle"></div>
                        <div class="caption-sub" id="captionSub"></div>
                    </div>
                    <div class="viewer-progress" id="viewerProgress">
                        <div class="viewer-progress-fill" id="frameProgressFill">
                            <div class="viewer-progress-thumb"></div>
                        </div>
                    </div>
                    <div class="gesture-overlay" id="gestureOverlay"></div>

                    <div class="select-layer" id="selectLayer">
                        <div class="select-topbar">
                            <div class="select-tip">拖动选框对准目标产品，然后点击“识别”。</div>
                            <button class="select-btn" id="cancelSelectBtn" type="button">取消</button>
                            <button class="select-btn primary" id="confirmSelectBtn" type="button">识别</button>
                        </div>
                        <div class="select-rect" id="selectRect">
                            <div class="select-handle handle-tl" data-handle="tl"></div>
                            <div class="select-handle handle-tr" data-handle="tr"></div>
                            <div class="select-handle handle-bl" data-handle="bl"></div>
                            <div class="select-handle handle-br" data-handle="br"></div>
                        </div>
                    </div>

                    <div class="preview-modal" id="previewModal">
                        <div class="modal-card">
                            <div class="modal-title">已圈选目标</div>
                            <div class="modal-sub">是否跳转到咨询页开始分析？你也可以继续刷到更清晰的画面。</div>
                            <div class="modal-preview"><img id="previewImg" alt="preview"></div>
                            <div class="modal-actions">
                                <button id="stayBtn" type="button">继续刷</button>
                                <button class="primary" id="goBtn" type="button">去咨询分析</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" id="nav1">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 7a1 1 0 0 1 1 1v1.2l1.1-.7a1 1 0 1 1 1.06 1.7L13 13v1a1 1 0 1 1-2 0v-1l-2.16-1.8A1 1 0 1 1 9.9 9.7l1.1.7V8a1 1 0 0 1 1-1zm7 3a1 1 0 0 1 1 1c0 5-4.03 9-9 9s-9-4-9-9a1 1 0 1 1 2 0c0 3.87 3.14 7 7 7s7-3.13 7-7a1 1 0 0 1 1-1z"/>
                </svg>
                <span>刷视频</span>
            </div>
            <div class="nav-item" id="nav2">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span>咨询</span>
            </div>
            <div class="nav-item" id="nav3">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 19a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4zm7 0a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-2zm7 0a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2z"/>
                </svg>
                <span>排行榜</span>
            </div>
            <div class="nav-item" id="nav4">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <script>
        const feedItems = [
             {
                title: '可以当作谷子的耳机',
                sub: '该视频仅供测试使用，不涉及任何商业用途。',
                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-1.mp4',

                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-2.mp4',
                poster: 'feed-2.jpg'
            },
            {
                title: '这种相机镜头谁懂啊',
                sub: '该视频仅供测试使用，不涉及任何商业用途。',
                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-3.mp4',
                poster: 'feed-3.jpg'
            },
            {

                sub: '该视频仅供测试使用，不涉及任何商业用途。',
                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-4.mp4',
		poster: 'feed-4.jpg'
            },
            {
                title: '貌美平板电脑大全',
                sub: '该视频仅供测试使用，不涉及任何商业用途。',
                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-5.mp4',
		poster: 'feed-5.jpg'
            },
            {
                title: '爱玩游戏的都来买',
                sub: '该视频仅供测试使用，不涉及任何商业用途。',
                video: 'https://raw.githubusercontent.com/dd666mouse/-/main/feed-6.mp4',
		poster: 'feed-6.jpg'
            }
        ];


        const backBtn = document.getElementById('backBtn');
        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');
        const nav4 = document.getElementById('nav4');

        const masonry = document.getElementById('masonry');
        const viewer = document.getElementById('viewer');
        const frame = document.getElementById('frame');
        const frameVideo = document.getElementById('frameVideo');
        const captionTitle = document.getElementById('captionTitle');
        const captionSub = document.getElementById('captionSub');
        const gestureOverlay = document.getElementById('gestureOverlay');
        const viewerProgress = document.getElementById('viewerProgress') || null;
        const frameProgressFill = document.getElementById('frameProgressFill');
        const viewerHint = document.getElementById('viewerHint');
        const closeViewerBtn = document.getElementById('closeViewerBtn');
        const openSelectBtn = document.getElementById('openSelectBtn');

        const selectLayer = document.getElementById('selectLayer');
        const selectRect = document.getElementById('selectRect');
        const cancelSelectBtn = document.getElementById('cancelSelectBtn');
        const confirmSelectBtn = document.getElementById('confirmSelectBtn');

        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const stayBtn = document.getElementById('stayBtn');
        const goBtn = document.getElementById('goBtn');

        let longPressTimer = null;
        let longPressTargetIndex = -1;
        let longPressTriggered = false;
        let isSelecting = false;
        let selection = { x: 80, y: 140, w: 220, h: 220 };
        let dragMode = null;
        let dragStart = null;
        let selectedDataUrl = '';
        let viewerOpen = false;
        let viewerTapStart = null;
        let isSeekingProgress = false;
        let currentViewerIndex = 0;

        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        function openViewer(itemIndex) {
            const safeIndex = clamp(itemIndex, 0, feedItems.length - 1);
            const item = feedItems[safeIndex];
            currentViewerIndex = safeIndex;
            viewerOpen = true;
            viewer.style.display = 'block';
            frameVideo.poster = item.poster || '';
            frameVideo.src = item.video;
            frameVideo.currentTime = 0;
            frameVideo.play().catch(() => {});
            captionTitle.textContent = item.title;
            captionSub.textContent = item.sub;
            closeSelectLayer();
            closePreview();
        }

        function closeViewer() {
            viewerOpen = false;
            frameVideo.pause();
            frameVideo.removeAttribute('src');
            frameVideo.load();
            viewer.style.display = 'none';
            closeSelectLayer();
            closePreview();
        }

        function openSelectLayer(clientX, clientY) {
            const rect = frame.getBoundingClientRect();
            const x = clamp(clientX - rect.left, 0, rect.width);
            const y = clamp(clientY - rect.top, 0, rect.height);

            const initW = clamp(rect.width * 0.46, 160, 260);
            const initH = initW;
            selection.w = initW;
            selection.h = initH;
            selection.x = clamp(x - initW / 2, 10, rect.width - initW - 10);
            selection.y = clamp(y - initH / 2, 60, rect.height - initH - 10);

            frameVideo.pause();
            isSelecting = true;
            viewerHint.style.display = 'none';
            selectLayer.style.display = 'block';
            renderSelection();
        }

        function closeSelectLayer() {
            isSelecting = false;
            selectLayer.style.display = 'none';
            viewerHint.style.display = 'flex';
            dragMode = null;
            dragStart = null;
        }

        function renderSelection() {
            selectRect.style.left = `${selection.x}px`;
            selectRect.style.top = `${selection.y}px`;
            selectRect.style.width = `${selection.w}px`;
            selectRect.style.height = `${selection.h}px`;
        }

        function startDrag(mode, clientX, clientY) {
            dragMode = mode;
            dragStart = {
                mode,
                x: clientX,
                y: clientY,
                base: { ...selection }
            };
        }

        function dragMove(clientX, clientY) {
            if (!dragStart) return;
            const rect = frame.getBoundingClientRect();
            const dx = clientX - dragStart.x;
            const dy = clientY - dragStart.y;

            const minSize = 100;
            const padding = 10;
            const topSafe = 60;

            const b = dragStart.base;
            let nx = b.x;
            let ny = b.y;
            let nw = b.w;
            let nh = b.h;

            if (dragStart.mode === 'move') {
                nx = clamp(b.x + dx, padding, rect.width - b.w - padding);
                ny = clamp(b.y + dy, topSafe, rect.height - b.h - padding);
            } else {
                if (dragStart.mode.includes('l')) {
                    const maxLeft = b.x + b.w - minSize;
                    nx = clamp(b.x + dx, padding, maxLeft);
                    nw = b.w + (b.x - nx);
                }
                if (dragStart.mode.includes('r')) {
                    nw = clamp(b.w + dx, minSize, rect.width - b.x - padding);
                }
                if (dragStart.mode.includes('t')) {
                    const maxTop = b.y + b.h - minSize;
                    ny = clamp(b.y + dy, topSafe, maxTop);
                    nh = b.h + (b.y - ny);
                }
                if (dragStart.mode.includes('b')) {
                    nh = clamp(b.h + dy, minSize, rect.height - b.y - padding);
                }
            }

            selection = { x: nx, y: ny, w: nw, h: nh };
            renderSelection();
        }

        function endDrag() {
            dragMode = null;
            dragStart = null;
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result || '');
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function cropSelectionToDataUrl() {
            const rect = frame.getBoundingClientRect();
            const media = frameVideo;
            const naturalW = media.videoWidth || frame.clientWidth || 1;
            const naturalH = media.videoHeight || frame.clientHeight || 1;

            const containerW = rect.width;
            const containerH = rect.height;
            const coverScale = Math.max(containerW / naturalW, containerH / naturalH);
            const displayW = naturalW * coverScale;
            const displayH = naturalH * coverScale;
            const offsetX = (containerW - displayW) / 2;
            const offsetY = (containerH - displayH) / 2;

            let sx = (selection.x - offsetX) / coverScale;
            let sy = (selection.y - offsetY) / coverScale;
            let sw = selection.w / coverScale;
            let sh = selection.h / coverScale;

            sx = clamp(sx, 0, naturalW);
            sy = clamp(sy, 0, naturalH);
            sw = clamp(sw, 1, naturalW - sx);
            sh = clamp(sh, 1, naturalH - sy);

            const maxSide = 900;
            const scaleOut = Math.min(1, maxSide / Math.max(sw, sh));
            const cw = Math.max(1, Math.round(sw * scaleOut));
            const ch = Math.max(1, Math.round(sh * scaleOut));

            const canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';
            try {
                ctx.drawImage(media, sx, sy, sw, sh, 0, 0, cw, ch);
                return canvas.toDataURL('image/jpeg', 0.92);
            } catch (error) {
                return '';
            }
        }

        function openPreview(dataUrl) {
            selectedDataUrl = dataUrl;
            previewImg.src = dataUrl;
            previewModal.style.display = 'flex';
        }

        function closePreview() {
            previewModal.style.display = 'none';
        }

        function toggleViewerPlayback() {
            if (!viewerOpen || isSelecting) return;
            if (frameVideo.paused) {
                frameVideo.play().catch(() => {});
            } else {
                frameVideo.pause();
            }
        }

        function updateProgressFill(video, fill) {
            if (!fill) return;
            const duration = Number.isFinite(video.duration) ? video.duration : 0;
            const ratio = duration > 0 ? clamp(video.currentTime / duration, 0, 1) : 0;
            fill.style.width = `${ratio * 100}%`;
        }

        function bindVideoProgress(video, fill) {
            const sync = () => updateProgressFill(video, fill);
            ['loadedmetadata', 'timeupdate', 'seeking', 'seeked', 'play', 'pause', 'ended'].forEach((eventName) => {
                video.addEventListener(eventName, sync);
            });
            sync();
        }

        function seekViewerVideo(clientX) {
            if (!viewerProgress) return;
            const duration = Number.isFinite(frameVideo.duration) ? frameVideo.duration : 0;
            if (duration <= 0) return;
            const rect = viewerProgress.getBoundingClientRect();
            const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
            frameVideo.currentTime = duration * ratio;
            updateProgressFill(frameVideo, frameProgressFill);
        }

        function switchViewerVideo(delta) {
            if (!viewerOpen || isSelecting) return;
            const nextIndex = currentViewerIndex + delta;
            if (nextIndex < 0 || nextIndex >= feedItems.length) return;
            openViewer(nextIndex);
        }

        function startLongPress(e) {
            if (isSelecting) return;
            if (longPressTimer) clearTimeout(longPressTimer);
            const p = e.touches && e.touches[0] ? e.touches[0] : e;
            longPressTimer = setTimeout(() => {
                if (longPressTargetIndex >= 0 && !viewerOpen) {
                    openViewer(longPressTargetIndex);
                    requestAnimationFrame(() => {
                        openSelectLayer(p.clientX, p.clientY);
                    });
                } else if (viewerOpen) {
                    openSelectLayer(p.clientX, p.clientY);
                }
                longPressTriggered = true;
            }, 650);
        }

        function cancelLongPress() {
            if (longPressTimer) clearTimeout(longPressTimer);
            longPressTimer = null;
        }

        function renderMasonry() {
            masonry.innerHTML = '';
            feedItems.forEach((item, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                const mediaMarkup = item.poster
                    ? `<img class="tile-cover" src="${item.poster}" alt="${item.title}" loading="lazy" decoding="async">`
                    : `
                        <div class="tile-fallback variant-${(i % 3) + 1}" aria-label="${item.title}">
                            <div class="tile-fallback-body">
                                <div class="tile-fallback-play" aria-hidden="true"></div>
                                <div class="tile-fallback-copy">
                                    <div class="tile-fallback-title">${item.title}</div>
                                    <div class="tile-fallback-sub">${item.sub}</div>
                                </div>
                            </div>
                        </div>
                    `;
                const shadeMarkup = item.poster
                    ? `
                        <div class="tile-shade">
                            <div class="tile-title">${item.title}</div>
                            <div class="tile-sub">${item.sub}</div>
                        </div>
                    `
                    : '';
                tile.innerHTML = `
                    <div class="tile-badge">长按选框</div>
                    ${mediaMarkup}
                    ${shadeMarkup}
                `;

                let start = null;
                tile.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    longPressTriggered = false;
                    longPressTargetIndex = i;
                    start = { x: e.clientX, y: e.clientY };
                    startLongPress(e);
                });

                tile.addEventListener('pointermove', (e) => {
                    if (!start) return;
                    const dx = e.clientX - start.x;
                    const dy = e.clientY - start.y;
                    if (Math.hypot(dx, dy) > 12) cancelLongPress();
                });

                tile.addEventListener('pointerup', () => {
                    cancelLongPress();
                    if (!longPressTriggered) openViewer(i);
                    start = null;
                    longPressTargetIndex = -1;
                });

                tile.addEventListener('pointercancel', () => {
                    cancelLongPress();
                    start = null;
                    longPressTargetIndex = -1;
                });

                masonry.appendChild(tile);
            });
        }

        function initEvents() {
            backBtn.addEventListener('click', () => {
                window.location.href = 'home.html';
            });

            nav1.addEventListener('click', () => {
                window.location.href = 'feed.html';
            });
            nav2.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav3.addEventListener('click', () => {
                window.location.href = 'rank.html';
            });
            nav4.addEventListener('click', () => {
                window.location.href = 'index2.html';
            });

            closeViewerBtn.addEventListener('click', () => {
                closeViewer();
            });

            openSelectBtn.addEventListener('click', () => {
                const rect = frame.getBoundingClientRect();
                openSelectLayer(rect.left + rect.width / 2, rect.top + rect.height / 2);
            });

            gestureOverlay.addEventListener('pointerdown', (e) => {
                if (!viewerOpen) return;
                viewerTapStart = { x: e.clientX, y: e.clientY, time: Date.now() };
                longPressTriggered = false;
                startLongPress(e);
            });

            gestureOverlay.addEventListener('pointermove', (e) => {
                if (!viewerTapStart || isSelecting) return;
                const dx = e.clientX - viewerTapStart.x;
                const dy = e.clientY - viewerTapStart.y;
                if (Math.hypot(dx, dy) > 12) {
                    cancelLongPress();
                }
            });

            gestureOverlay.addEventListener('pointerup', (e) => {
                cancelLongPress();
                if (!viewerTapStart || isSelecting) return;
                const dx = e.clientX - viewerTapStart.x;
                const dy = e.clientY - viewerTapStart.y;
                const dt = Date.now() - viewerTapStart.time;
                const isVerticalSwipe = Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.2;
                const isTap = Math.hypot(dx, dy) < 12 && dt < 280;
                if (isVerticalSwipe && !longPressTriggered) {
                    switchViewerVideo(dy < 0 ? 1 : -1);
                    viewerTapStart = null;
                    return;
                }
                if (isTap && !longPressTriggered) {
                    toggleViewerPlayback();
                }
                viewerTapStart = null;
            });

            gestureOverlay.addEventListener('pointercancel', () => {
                cancelLongPress();
                viewerTapStart = null;
            });

            if (viewerProgress) {
                viewerProgress.addEventListener('pointerdown', (e) => {
                    if (!viewerOpen || isSelecting) return;
                    e.preventDefault();
                    e.stopPropagation();
                    isSeekingProgress = true;
                    seekViewerVideo(e.clientX);
                });
            }

            selectLayer.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.select-topbar')) return;
                e.preventDefault();
                const handle = e.target && e.target.dataset ? e.target.dataset.handle : '';
                if (handle) {
                    startDrag(handle, e.clientX, e.clientY);
                    return;
                }
                if (e.target === selectRect) {
                    startDrag('move', e.clientX, e.clientY);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (isSeekingProgress) {
                    e.preventDefault();
                    seekViewerVideo(e.clientX);
                    return;
                }
                if (!isSelecting) return;
                if (!dragStart) return;
                dragMove(e.clientX, e.clientY);
            });

            window.addEventListener('pointerup', () => {
                if (isSeekingProgress) {
                    isSeekingProgress = false;
                    return;
                }
                if (!isSelecting) return;
                endDrag();
            });

            cancelSelectBtn.addEventListener('click', () => {
                closeSelectLayer();
            });

            confirmSelectBtn.addEventListener('click', async () => {
                const dataUrl = await cropSelectionToDataUrl();
                if (!dataUrl) {
                    alert('当前这段视频暂时无法直接截帧，请换一个画面重试，或返回咨询页上传截图。');
                    return;
                }
                selectedDataUrl = dataUrl;
                closeSelectLayer();
                openPreview(dataUrl);
            });

            stayBtn.addEventListener('click', () => {
                closePreview();
            });

            goBtn.addEventListener('click', () => {
                if (!selectedDataUrl) return;
                localStorage.setItem('selectedImage', selectedDataUrl);
                window.location.href = 'index.html';
            });

            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) closePreview();
            });

            viewer.addEventListener('click', (e) => {
                if (e.target === viewer) closeViewer();
            });
        }

        frameVideo.addEventListener('loadedmetadata', () => {
            renderSelection();
        });

        bindVideoProgress(frameVideo, frameProgressFill);

        renderMasonry();
        initEvents();
        updatePreviewSafeArea();

        function updatePreviewSafeArea() {
            const vh = window.innerHeight;
            const safeBottom = Math.max(0, vh - document.documentElement.clientHeight);
            if (safeBottom > 0) {
                document.querySelector('.modal-card').style.paddingBottom = `${16 + safeBottom}px`;
            }
        }

        window.addEventListener('resize', updatePreviewSafeArea);
    </script>
