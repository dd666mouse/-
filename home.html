<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 数码消费决策助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
        }

        /* Brand Section */
        .brand-section {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUkrZqFZcwdRfIOSbhmqkpOLMpKl86AwACsB0AAleasVSrnQABtqiXm3Q7BA.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 40px rgba(168, 85, 247, 0.3);
        }

        .brand-name {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .brand-slogan {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        /* Camera Button */
        .camera-section {
            margin-bottom: 40px;
        }

        .camera-button-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .camera-halo {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            opacity: 0.3;
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }

        .camera-button {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #06b6d4 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .camera-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 48px rgba(168, 85, 247, 0.5);
        }

        .camera-button:active {
            transform: scale(0.95);
        }

        .camera-icon {
            width: 64px;
            height: 64px;
        }

        .camera-icon svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        .camera-text {
            text-align: center;
            margin-top: 24px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        /* Gallery Link */
        .gallery-link {
            text-align: center;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .gallery-button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            padding: 12px 24px;
            transition: all 0.2s;
        }

        .gallery-button:hover {
            color: #a855f7;
        }

        /* Status Dots */
        .status-dots {
            display: flex;
            gap: 8px;
            position: absolute;
            top: 24px;
            right: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        /* Hidden file input */
        input[type="file"] {
            display: none;
        }

        /* Navigate Button */
        .navigate-btn {
            position: absolute;
            bottom: 40px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .navigate-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Status Dots -->
        <div class="status-dots">
            <div class="status-dot"></div>
        </div>

        <!-- Brand Section -->
        <div class="brand-section">
            <div class="brand-logo"></div>
            <div class="brand-name">PriceLens</div>
            <div class="brand-slogan">数码消费决策助手</div>
        </div>

        <!-- Camera Section -->
        <div class="camera-section">
            <div class="camera-button-wrapper">
                <div class="camera-halo"></div>
                <button class="camera-button" id="cameraBtn">
                    <div class="camera-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                </button>
            </div>
            <div class="camera-text">点击拍照识别产品</div>
        </div>

        <!-- Gallery Link -->
        <div class="gallery-link">
            <button class="gallery-button" id="galleryBtn">从相册选择</button>
        </div>

        <!-- Navigate to Chat -->
        <a href="index.html" class="navigate-btn">进入对话界面</a>
    </div>

    <input type="file" id="fileInput" accept="image/*">
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <script>
        const cameraBtn = document.getElementById('cameraBtn');
        const galleryBtn = document.getElementById('galleryBtn');
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');

        // Camera button - 尝试使用摄像头，如果失败则退回到文件选择
        cameraBtn.addEventListener('click', () => {
            // 先尝试使用 capture="environment"
            cameraInput.click();
            
            // 如果摄像头不可用，提供文件选择作为备选
            setTimeout(() => {
                // 检查是否支持摄像头功能
                if (!('MediaDevices' in window) || !('getUserMedia' in navigator.mediaDevices)) {
                    console.log('摄像头不可用，使用文件选择');
                }
            }, 100);
        });

        // Gallery button
        galleryBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    // 保存图片到 localStorage 并跳转到分析页面
                    localStorage.setItem('selectedImage', event.target.result);
                    window.location.href = 'index.html';
                };
                reader.readAsDataURL(file);
            }
            // 重置 input，允许再次选择同一文件
            e.target.value = '';
        }

        fileInput.addEventListener('change', handleFileSelect);
        cameraInput.addEventListener('change', handleFileSelect);
        
        // 添加错误处理
        cameraInput.addEventListener('error', (e) => {
            console.log('摄像头错误，回退到文件选择');
            fileInput.click();
        });
    </script>
</body>
</html>
