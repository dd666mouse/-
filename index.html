<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 数码消费决策助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Welcome Message */
        .welcome-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 8px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quick-action {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.9);
        }

        .quick-action:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .quick-action:active {
            transform: translateY(0);
        }

        /* Chat Messages */
        .message {
            max-width: 85%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border-bottom-right-radius: 6px;
        }

        .message.assistant .message-bubble {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 6px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            cursor: pointer;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            background: transparent;
            border-top: none;
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 8px 12px;
        }

        .input-wrapper:focus-within {
            border-color: rgba(168, 85, 247, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 4px;
            padding-bottom: 4px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.7);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.recording {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            animation: recordingPulse 1s ease-in-out infinite;
        }

        @keyframes recordingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 36px;
            line-height: 1.5;
            padding: 6px 0;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Image Preview */
        .image-preview-container {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            flex-wrap: wrap;
        }

        .image-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .settings-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }

        .settings-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .settings-input:focus {
            border-color: rgba(168, 85, 247, 0.5);
        }

        .settings-buttons {
            display: flex;
            gap: 12px;
        }

        .settings-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .settings-btn.save {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            color: white;
        }

        .settings-btn:hover {
            opacity: 0.9;
        }

        /* API Key Button */
        .api-key-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .api-key-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .api-key-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Back Button */
        .back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }

        /* Hidden file input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="返回首页">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="brand">
                    <div class="brand-logo">P</div>
                    <div class="brand-name">PriceLens</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="status-dot"></div>
                    <button class="api-key-btn" id="settingsBtn" title="设置API Key">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-card">
                <div class="welcome-title">👋 你好，我是PriceLens</div>
                <div class="welcome-text">
                    你的专属数码消费决策助手！我可以帮你：<br>
                    • 识别数码产品型号<br>
                    • 分析价格走势<br>
                    • 给出购买建议
                </div>
                <div class="quick-actions">
                    <div class="quick-action" data-text="帮我分析一下iPhone 15 Pro值得买吗">📱 iPhone分析</div>
                    <div class="quick-action" data-text="现在买MacBook Pro划算吗">💻 MacBook建议</div>
                    <div class="quick-action" data-text="618数码产品会降价多少">💰 价格预测</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="image-preview-container" id="imagePreviewContainer"></div>
            <div class="input-wrapper">
                <div class="action-buttons">
                    <button class="action-btn" id="imageBtn" title="上传图片">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 16L8.586 11.414C8.977 11.023 9.59 10.905 10.09 11.105C10.295 11.188 10.485 11.33 10.644 11.518L14 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 14L15.586 12.414C15.977 12.023 16.59 11.905 17.09 12.105C17.295 12.188 17.485 12.33 17.644 12.518L20 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3.5 8.5L7.5 4.5L11.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7 4.5V15.5C7 16.605 7.895 17.5 9 17.5H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20 20H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="voiceBtn" title="语音输入">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </button>
                </div>
                <textarea class="text-input" id="textInput" placeholder="输入消息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav1">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

                </svg>
                <span>咨询</span>
            </div>
            <div class="nav-item" id="nav2">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

                </svg>
                <span>产品库</span>
            </div>
            <div class="nav-item" id="nav3">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <div class="settings-title">⚙️ API 设置</div>
            <input type="password" class="settings-input" id="apiKeyInput" placeholder="请输入豆包 API Key">
            <input type="text" class="settings-input" id="modelIdInput" placeholder="请输入接入点 ID (Endpoint ID)">
            <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 16px;">
                接入点 ID 可以在火山引擎方舟控制台找到，格式类似：ep-20250527011325-xxxxx
            </div>
            <div class="settings-buttons">
                <button class="settings-btn cancel" id="cancelSettings">取消</button>
                <button class="settings-btn save" id="saveSettings">保存</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <script>
        // System Prompt
        const SYSTEM_PROMPT = `# 角色
你是 PriceLens，一位懂行且贴心的数码产品消费决策助手，像身边最靠谱的"数码参谋"——既用专业数据帮你分析产品价值，又用朋友式的语气给你人性化建议，让消费决策更清晰、更省心。

## 技能
### 技能1：精准识别数码产品型号
- 输入处理：接收用户上传的清晰照片（含产品外观，重点关注摄像头、参数标签、型号标识等细节）或文字描述
- 识别逻辑：通过图像特征或文字描述，确定产品具体型号（如"iPhone 15 Pro 256GB"），若无法识别（如模糊照片或冷门型号），说明"暂无法识别，建议上传清晰、含更多特征（或标签）的产品照片"。

### 技能2：生成价格走势预测

        // App State
        const state = {
            apiKey: localStorage.getItem('doubao_api_key') || 'ark-0a58b840-8bb3-4c90-8528-413397e9be41-de715',
            modelId: localStorage.getItem('doubao_model_id') || 'apikey-20260526164024-jtmz7',
            chatHistory: [],
            selectedImages: [],
            isRecording: false,
            isLoading: false
        };

        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageBtn = document.getElementById('imageBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const fileInput = document.getElementById('fileInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelIdInput = document.getElementById('modelIdInput');
        const cancelSettings = document.getElementById('cancelSettings');
        const saveSettings = document.getElementById('saveSettings');
        const quickActions = document.querySelectorAll('.quick-action');
        const backBtn = document.getElementById('backBtn');
        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');

        // Initialize
        function init() {
            if (state.apiKey) {
                apiKeyInput.value = state.apiKey;
            }
            if (state.modelId) {
                modelIdInput.value = state.modelId;
            }
            
            // Check for selected image from home page
            const selectedImage = localStorage.getItem('selectedImage');
            if (selectedImage) {
                state.selectedImages.push({ data: selectedImage, file: null });
                renderImagePreviews();
                handleTextInput();
                localStorage.removeItem('selectedImage');
            }
            
            // Auto-resize textarea
            textInput.addEventListener('input', handleTextInput);
            
            // Send message
            sendBtn.addEventListener('click', sendMessage);
            textInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Image upload
            imageBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleImageSelect);
            
            // Voice input
            voiceBtn.addEventListener('click', toggleVoiceRecording);
            
            // Settings
            settingsBtn.addEventListener('click', openSettings);
            cancelSettings.addEventListener('click', closeSettings);
            saveSettings.addEventListener('click', saveApiKey);
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) closeSettings();
            });
            
            // Quick actions
            quickActions.forEach(action => {
                action.addEventListener('click', () => {
                    textInput.value = action.dataset.text;
                    handleTextInput();
                    sendMessage();
                });
            });
            
            // Back button
            backBtn.addEventListener('click', () => {
                window.location.href = 'home.html';
            });
            
            // Navigation
            nav1.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav2.addEventListener('click', () => {
                window.location.href = 'index2.html';
            });
            nav3.addEventListener('click', () => {
                window.location.href = 'index3.html';
            });
        }

        // Handle text input
        function handleTextInput() {
            textInput.style.height = 'auto';
            textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = (!textInput.value.trim() && state.selectedImages.length === 0) || state.isLoading;
        }

        // Handle image selection
        function handleImageSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imageData = event.target.result;
                    state.selectedImages.push({ data: imageData, file: file });
                    renderImagePreviews();
                    handleTextInput();
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        }

        // Render image previews
        function renderImagePreviews() {
            imagePreviewContainer.innerHTML = '';
            state.selectedImages.forEach((img, index) => {
                const preview = document.createElement('div');
                preview.className = 'image-preview';
                preview.innerHTML = `
                    <img src="${img.data}" alt="预览">
                    <button class="image-preview-remove" data-index="${index}">×</button>
                `;
                imagePreviewContainer.appendChild(preview);
            });
            
            document.querySelectorAll('.image-preview-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    state.selectedImages.splice(index, 1);
                    renderImagePreviews();
                    handleTextInput();
                });
            });
        }

        // Toggle voice recording
        function toggleVoiceRecording() {
            if (state.isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        // Start voice recording
        function startRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能，请使用Chrome浏览器');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                state.isRecording = true;
                voiceBtn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                handleTextInput();
                stopRecording();
            };

            recognition.onerror = (event) => {
                console.error('语音识别错误:', event);
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };

            recognition.start();
            state.recognition = recognition;
        }

        // Stop recording
        function stopRecording() {
            state.isRecording = false;
            voiceBtn.classList.remove('recording');
            if (state.recognition) {
                try {
                    state.recognition.stop();
                } catch (e) {}
            }
        }

        // Send message
        async function sendMessage() {
            if ((!textInput.value.trim() && state.selectedImages.length === 0) || state.isLoading) {
                return;
            }

            if (!state.apiKey || !state.modelId) {
                openSettings();
                return;
            }

            const messageText = textInput.value.trim();
            const images = [...state.selectedImages];
            
            // Clear input
            textInput.value = '';
            state.selectedImages = [];
            renderImagePreviews();
            handleTextInput();

            // Add user message
            addMessage(messageText, 'user', images);

            // Show typing indicator
            showTypingIndicator();
            state.isLoading = true;
            sendBtn.disabled = true;

            try {
                // Call Doubao API
                const response = await callDoubaoAPI(messageText, images);
                hideTypingIndicator();
                addMessage(response, 'assistant');
            } catch (error) {
                hideTypingIndicator();
                addMessage('抱歉，遇到了一些问题：' + error.message + '。请检查API Key是否正确。', 'assistant');
            } finally {
                state.isLoading = false;
                handleTextInput();
            }
        }

        // Add message to chat
        function addMessage(text, role, images = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let bubbleContent = '';
            
            if (images && images.length > 0) {
                images.forEach(img => {
                    bubbleContent += `<img src="${img.data}" class="message-image" alt="图片">`;
                });
            }
            
            if (text) {
                bubbleContent += `<div>${escapeHtml(text)}</div>`;
            }

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            messageDiv.innerHTML = `
                <div class="message-bubble">${bubbleContent}</div>
                <div class="message-time">${timeStr}</div>
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Save to history
            if (role === 'user' || role === 'assistant') {
                state.chatHistory.push({
                    role: role,
                    content: text,
                    images: images
                });
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Call Doubao API
        async function callDoubaoAPI(userText, images) {
            const messages = [
                {
                    role: 'system',
                    content: SYSTEM_PROMPT
                }
            ];

            // Add chat history
            state.chatHistory.forEach(msg => {
                if (msg.role === 'user' || msg.role === 'assistant') {
                    let content = [];
                    if (msg.images && msg.images.length > 0) {
                        msg.images.forEach(img => {
                            content.push({
                                type: 'image_url',
                                image_url: {
                                    url: img.data
                                }
                            });
                        });
                    }
                    if (msg.content) {
                        content.push({
                            type: 'text',
                            text: msg.content
                        });
                    }
                    messages.push({
                        role: msg.role,
                        content: content.length > 0 ? content : msg.content
                    });
                }
            });

            // Build current message content
            let currentContent = [];
            if (images && images.length > 0) {
                images.forEach(img => {
                    currentContent.push({
                        type: 'image_url',
                        image_url: {
                            url: img.data
                        }
                    });
                });
            }
            if (userText) {
                currentContent.push({
                    type: 'text',
                    text: userText
                });
            }

            messages.push({
                role: 'user',
                content: currentContent.length > 0 ? currentContent : userText
            });

            const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                },
                body: JSON.stringify({
                    model: state.modelId,
                    messages: messages,
                    stream: false,
                    temperature: 0.7,
                    max_tokens: 2000,
                    thinking: {
                        type: 'disabled'
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `API 请求失败 (${response.status})`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // Settings functions
        function openSettings() {
            apiKeyInput.value = state.apiKey;
            settingsModal.classList.add('show');
        }

        function closeSettings() {
            settingsModal.classList.remove('show');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            const model = modelIdInput.value.trim();
            if (key && model) {
                state.apiKey = key;
                state.modelId = model;
                localStorage.setItem('doubao_api_key', key);
                localStorage.setItem('doubao_model_id', model);
                closeSettings();
            } else {
                alert('请同时填写API Key和接入点ID');
            }
        }

        // Initialize app
        init();
    </script>
