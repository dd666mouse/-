<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceLens - 数码消费决策助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUksdqFZkc9qnEKF9x3xYwkBWLsO5WRAACyx0AAleasVTb05LqASi_UTsE.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            background: rgba(15, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 44px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #44c7ff 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(64, 156, 255, 0.22);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.18));
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            white-space: nowrap;
            background: linear-gradient(90deg, #8b5cf6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Welcome Message */
        .welcome-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 8px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
        }

        .quick-action {
            flex: 0.85 1 0;
            min-width: 0;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quick-action:nth-child(2) {
            flex: 1.3 1 0;
        }

        .quick-action:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .quick-action:active {
            transform: translateY(0);
        }

        /* Chat Messages */
        .message {
            max-width: 85%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border-bottom-right-radius: 6px;
        }

        .message.assistant .message-bubble {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(6, 182, 212, 0.25) 100%), rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom-left-radius: 6px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            cursor: pointer;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        .follow-ups {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .follow-up-chip {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.92);
            text-align: left;
        }

        .follow-up-chip:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .follow-up-chip-text {
            font-size: 13px;
            line-height: 1.4;
            flex: 1;
        }

        .follow-up-chip-arrow {
            font-size: 16px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            background: transparent;
            border-top: none;
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 8px 12px;
        }

        .input-wrapper:focus-within {
            border-color: rgba(168, 85, 247, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 4px;
            padding-bottom: 4px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.7);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.recording {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            animation: recordingPulse 1s ease-in-out infinite;
        }

        @keyframes recordingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
        }

        #imageBtn {
            position: relative;
        }

        #imageBtn::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        #imageBtn svg {
            position: relative;
            z-index: 1;
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 36px;
            line-height: 1.5;
            padding: 6px 0;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Image Preview */
        .image-preview-container {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            flex-wrap: wrap;
        }

        .image-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .settings-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }

        .settings-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .settings-input:focus {
            border-color: rgba(168, 85, 247, 0.5);
        }

        .settings-buttons {
            display: flex;
            gap: 12px;
        }

        .settings-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .settings-btn.save {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            color: white;
        }

        .settings-btn:hover {
            opacity: 0.9;
        }

        /* API Key Button */
        .api-key-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .api-key-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .api-key-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Back Button */
        .back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active svg {
            fill: url(#gradient1);
        }

        /* Hidden file input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="返回首页">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="brand">
                    <div class="brand-logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <defs>
                                <linearGradient id="pl_logo_left" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
                                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.86"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_right" x1="1" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#eef2ff" stop-opacity="0.92"/>
                                    <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.78"/>
                                </linearGradient>
                                <linearGradient id="pl_logo_base" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
                                </linearGradient>
                            </defs>
                            <polygon points="50,8 12,78 50,92" fill="url(#pl_logo_left)"/>
                            <polygon points="50,8 50,92 88,78" fill="url(#pl_logo_right)"/>
                            <polygon points="12,78 50,92 88,78" fill="url(#pl_logo_base)"/>
                        </svg>
                    </div>
                    <div class="brand-name">PriceLens</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="status-dot"></div>
                    <button class="api-key-btn" id="settingsBtn" title="设置API Key">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-card">
                <div class="welcome-title">👋 你好，我是PriceLens</div>
                <div class="welcome-text">
                    你的专属数码消费决策助手！我可以帮你分析手机、电脑、平板、耳机等各类数码产品：<br>
                    • 识别具体产品型号<br>
                    • 判断当前值不值得买<br>
                    • 分析价格走势和购买时机
                </div>
                <div class="quick-actions">
                    <div class="quick-action" data-guide="现在将为您进行手机产品分析。请上传产品图片，或提供品牌、型号、存储版本、发布时间或当前价格等信息，我将为您进一步分析产品定位、价格走势与购买建议。">📱 手机</div>
                    <div class="quick-action" data-guide="现在将为您进行电脑或平板分析。请上传设备图片，或提供品牌、型号、芯片/处理器、内存、存储和使用需求等信息，我将结合性能定位与价格情况为您提供建议。">💻 电脑/平板</div>
                    <div class="quick-action" data-guide="现在将为您进行数码配件分析。请上传产品图片，或提供品牌、型号、版本及您的使用场景，例如通勤、运动或办公，我将为您评估产品价值与入手时机。">🎧 配件</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="image-preview-container" id="imagePreviewContainer"></div>
            <div class="input-wrapper">
                <div class="action-buttons">
                    <button class="action-btn" id="imageBtn" title="上传图片">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="voiceBtn" title="语音输入">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19 11V12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M8 22H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <textarea class="text-input" id="textInput" placeholder="输入消息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">

    <script>
        // System Prompt
        const SYSTEM_PROMPT = `# 角色
你是 PriceLens，一位懂行且贴心的数码产品消费决策助手，像身边最靠谱的"数码参谋"——既用专业数据帮你分析产品价值，又用朋友式的语气给你人性化建议，让消费决策更清晰、更省心。

## 技能
### 技能1：精准识别数码产品型号
- 输入处理：接收用户上传的清晰照片（含产品外观，重点关注摄像头、参数标签、型号标识等细节）或文字描述
- 识别逻辑：通过图像特征或文字描述，确定产品具体型号（如"iPhone 15 Pro 256GB"），若无法识别（如模糊照片或冷门型号），说明"暂无法识别，建议上传清晰、含更多特征（或标签）的产品照片"。

### 技能2：生成价格走势预测
- 数据整合：提取产品发布时间（精确到年/月）、官方发售价，结合历史降价规律（如数码产品迭代周期、促销节点：618降价30-50%、双11叠加满减、新品发布后老款降价潮等），预测未来价格走势。
- 可视化输出：用文字描述价格生命线图：标注关键节点（发布日、发售价、当前价、预测高峰/低谷）价格，用📈📉标记涨跌趋势。
- 历史节点要求：今天之前的节点必须优先写“实际历史价”，不要从发布价直接跳到当前价，不能把中间整段年份空过去。
- 当产品发布时间早于当前超过6个月时，今天之前至少给出3个历史节点，优先从这些典型节点里选：发售价、第一次明显降价、上一代/新一代产品发布带来的调价节点、去年的618、去年的双11、今年当前价。
- 时间逻辑要求：现在是2026年5月底，所以2026年5月底及之前都属于历史实际价；只有这之后的节点才属于预测价。像2026年618、2026年双11、2027年新品发布后，才可以标记为预测。
- 若缺少精确公开历史价格，可以结合常见促销节奏给出合理历史节点，但今天之前的节点不要写成预测。

### 技能3：星级推荐及人性化建议
- 星级逻辑：
  - ★★★★★（5星）：高性价比（降价空间小+刚需升级）→"闭眼入，现在正是好时机！"
  - ★★★★（4星）：值得入手（功能显著升级但非刚需）→"如果现在预算够，早买早享受；等降价也行，但可能错过最佳体验"
  - ★★★（3星）：按需入手（价格合理，刚需可入）→"这款产品适合[场景]，现在入手性价比不错，但不急的话可蹲618"
  - ★★（2星）/★（1星）：观望（降价空间大/功能冗余或落后）→"建议再等等，预计3个月内价格会下调15-20%，功能无明显升级"

## 回复格式要求
1. 产品型号：详细的产品型号，如 "iPhone 15 Pro 256GB"
2. 价格生命线图：文字描述关键节点（用📈📉标记涨跌趋势）。不要回复其他任何前置或后置内容；历史段至少要连贯，避免“发布价 -> 当前价”这种中间完全断档的写法
3. 星级推荐：前置"推荐购买指数：⭐️ [X星]"，后接20-50字口语化购买时机建议，用"朋友式"口吻补充（如"如果你是学生党，这款旗舰现在入手有点肉疼，等明年618降价2000元再冲更划算～"），语气温暖有温度；标注"建议入手窗口"。
        4. 价格格式：所有价格必须是单一数值（如"1899元"），不要输出区间/范围（如"1800-1900元"）。

以上三点之间以空行分隔

## 限制条件
1. 输入要求：必须由用户提供清晰产品照片/文字描述（如型号+参数）。
2. 格式规范：不要任何#*符号。
3. 现在的时间：2026年5月底
4. 语气要求：专业中带温度，避免"必须、应该"等生硬词，多用"你"、"建议"、"可以考虑"等生活化用词。`;

        // App State
        const state = {
            apiKey: localStorage.getItem('doubao_api_key') || 'ark-0a58b840-8bb3-4c90-8528-413397e9be41-de715',
            modelId: localStorage.getItem('doubao_model_id') || 'apikey-20260526164024-jtmz7',
            chatHistory: [],
            selectedImages: [],
            isRecording: false,
            isLoading: false,
            followUpRound: 0,
            lastSendSource: 'manual'
        };

        const PRICE_TIMELINE_NOW = new Date(2026, 4, 31);

        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageBtn = document.getElementById('imageBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const fileInput = document.getElementById('fileInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelIdInput = document.getElementById('modelIdInput');
        const cancelSettings = document.getElementById('cancelSettings');
        const saveSettings = document.getElementById('saveSettings');
        const quickActions = document.querySelectorAll('.quick-action');
        const backBtn = document.getElementById('backBtn');
        const nav1 = document.getElementById('nav1');
        const nav2 = document.getElementById('nav2');
        const nav3 = document.getElementById('nav3');
        const nav4 = document.getElementById('nav4');

        const CHAT_SESSION_KEY = 'pricelens_consult_chat_v1';

        function safeJsonParse(raw) {
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveChatSession() {
            try {
                const payload = {
                    chatHistory: Array.isArray(state.chatHistory) ? state.chatHistory : [],
                    followUpRound: state.followUpRound || 0
                };
                sessionStorage.setItem(CHAT_SESSION_KEY, JSON.stringify(payload));
            } catch (e) {}
        }

        function restoreChatSession() {
            const raw = sessionStorage.getItem(CHAT_SESSION_KEY);
            if (!raw) return;
            const parsed = safeJsonParse(raw);
            if (!parsed || !Array.isArray(parsed.chatHistory) || parsed.chatHistory.length === 0) return;

            state.chatHistory = parsed.chatHistory;
            state.followUpRound = parsed.followUpRound || 0;

            chatContainer.querySelectorAll('.message').forEach(el => el.remove());

            let lastAssistantEl = null;
            let lastAssistantText = '';

            state.chatHistory.forEach(msg => {
                const role = msg && msg.role ? msg.role : 'assistant';
                const text = msg && typeof msg.content === 'string' ? msg.content : '';
                const images = msg && Array.isArray(msg.images) ? msg.images : [];
                const imageCount = msg && typeof msg.imageCount === 'number' ? msg.imageCount : images.length;
                const time = msg && typeof msg.time === 'string' ? msg.time : '';
                const el = renderMessage(text, role, images, imageCount, time);
                if (role === 'assistant') {
                    lastAssistantEl = el;
                    lastAssistantText = text;
                }
            });

            if (lastAssistantEl) {
                attachFollowUpChips(lastAssistantEl, buildFollowUpQuestions(lastAssistantText, state.followUpRound || 0), true);
            }
        }

        function renderMessage(text, role, images = [], imageCount = 0, timeStrOverride = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let bubbleContent = '';

            const safeImages = Array.isArray(images) ? images : [];
            if (safeImages.length > 0) {
                safeImages.forEach(img => {
                    if (img && typeof img.data === 'string') {
                        bubbleContent += `<img src="${img.data}" class="message-image" alt="图片">`;
                    }
                });
            } else if (imageCount > 0) {
                bubbleContent += `<div style="margin-bottom: 8px; opacity: 0.7;">[图片]</div>`;
            }

            if (text) {
                if (role === 'assistant') {
                    bubbleContent += formatAIResponse(text);
                } else {
                    bubbleContent += `<div>${escapeHtml(text)}</div>`;
                }
            }

            const timeStr = timeStrOverride || (() => {
                const now = new Date();
                return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            })();

            messageDiv.innerHTML = `
                <div class="message-bubble">${bubbleContent}</div>
                <div class="message-time">${timeStr}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // Initialize
        function init() {
            if (state.apiKey) {
                apiKeyInput.value = state.apiKey;
            }
            if (state.modelId) {
                modelIdInput.value = state.modelId;
            }

            restoreChatSession();
            window.addEventListener('pagehide', saveChatSession);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') saveChatSession();
            });
            
            // Check for selected image from home page
            const selectedImage = localStorage.getItem('selectedImage');
            if (selectedImage) {
                state.selectedImages.push({ data: selectedImage, file: null });
                renderImagePreviews();
                handleTextInput();
                localStorage.removeItem('selectedImage');
            }

            const prefillText = localStorage.getItem('prefillText');
            if (prefillText) {
                textInput.value = prefillText;
                handleTextInput();
                localStorage.removeItem('prefillText');
            }
            
            // Auto-resize textarea
            textInput.addEventListener('input', handleTextInput);
            
            // Send message
            sendBtn.addEventListener('click', sendMessage);
            textInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Image upload
            imageBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleImageSelect);
            
            // Voice input
            voiceBtn.addEventListener('click', toggleVoiceRecording);
            
            // Settings
            settingsBtn.addEventListener('click', openSettings);
            cancelSettings.addEventListener('click', closeSettings);
            saveSettings.addEventListener('click', saveApiKey);
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) closeSettings();
            });
            
            // Quick actions
            quickActions.forEach(action => {
                action.addEventListener('click', () => {
                    handleQuickAction(action.dataset.guide || '');
                });
            });
            
            // Back button
            backBtn.addEventListener('click', () => {
                window.location.href = 'home.html';
            });
            
            // Navigation
            nav1.addEventListener('click', () => {
                window.location.href = 'feed.html';
            });
            nav2.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            nav3.addEventListener('click', () => {
                window.location.href = 'rank.html';
            });
            nav4.addEventListener('click', () => {
                window.location.href = 'index2.html';
            });
        }

        // Handle text input
        function handleTextInput() {
            textInput.style.height = 'auto';
            textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = (!textInput.value.trim() && state.selectedImages.length === 0) || state.isLoading;
        }

        // Handle image selection
        function handleImageSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imageData = event.target.result;
                    state.selectedImages.push({ data: imageData, file: file });
                    renderImagePreviews();
                    handleTextInput();
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        }

        // Render image previews
        function renderImagePreviews() {
            imagePreviewContainer.innerHTML = '';
            state.selectedImages.forEach((img, index) => {
                const preview = document.createElement('div');
                preview.className = 'image-preview';
                preview.innerHTML = `
                    <img src="${img.data}" alt="预览">
                    <button class="image-preview-remove" data-index="${index}">×</button>
                `;
                imagePreviewContainer.appendChild(preview);
            });
            
            document.querySelectorAll('.image-preview-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    state.selectedImages.splice(index, 1);
                    renderImagePreviews();
                    handleTextInput();
                });
            });
        }

        // Toggle voice recording
        function toggleVoiceRecording() {
            if (state.isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        // Start voice recording
        function startRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能，请使用Chrome浏览器');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                state.isRecording = true;
                voiceBtn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                handleTextInput();
                stopRecording();
            };

            recognition.onerror = (event) => {
                console.error('语音识别错误:', event);
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };

            recognition.start();
            state.recognition = recognition;
        }

        // Stop recording
        function stopRecording() {
            state.isRecording = false;
            voiceBtn.classList.remove('recording');
            if (state.recognition) {
                try {
                    state.recognition.stop();
                } catch (e) {}
            }
        }

        // Send message
        async function sendMessage() {
            if ((!textInput.value.trim() && state.selectedImages.length === 0) || state.isLoading) {
                return;
            }

            if (!state.apiKey || !state.modelId) {
                openSettings();
                return;
            }

            const sendSource = state.lastSendSource || 'manual';
            state.lastSendSource = 'manual';
            if (sendSource === 'followUp') {
                state.followUpRound = (state.followUpRound || 0) + 1;
            }

            const messageText = textInput.value.trim();
            const images = [...state.selectedImages];
            
            // Clear input
            textInput.value = '';
            state.selectedImages = [];
            renderImagePreviews();
            handleTextInput();

            // Add user message
            addMessage(messageText, 'user', images);

            // Show typing indicator
            showTypingIndicator();
            state.isLoading = true;
            sendBtn.disabled = true;

            try {
                // Call Doubao API
                const response = await callDoubaoAPI(messageText, images);
                hideTypingIndicator();
                const assistantMessageEl = addMessage(response, 'assistant');
                attachFollowUpChips(
                    assistantMessageEl,
                    buildFollowUpQuestions(response, state.followUpRound || 0),
                    sendSource === 'followUp'
                );
            } catch (error) {
                hideTypingIndicator();
                addMessage('抱歉，遇到了一些问题：' + error.message + '。请检查API Key是否正确。', 'assistant');
            } finally {
                state.isLoading = false;
                handleTextInput();
            }
        }

        // Add message to chat
        function addMessage(text, role, images = []) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            const safeImages = Array.isArray(images) ? images : [];
            const imageCount = safeImages.length;

            const messageDiv = renderMessage(text, role, safeImages, imageCount, timeStr);

            if (role === 'user' || role === 'assistant') {
                const storedImages = safeImages
                    .filter(img => img && typeof img.data === 'string' && img.data.length <= 200000)
                    .map(img => ({ data: img.data }));
                state.chatHistory.push({
                    role: role,
                    content: text,
                    images: storedImages,
                    imageCount,
                    time: timeStr
                });
                saveChatSession();
            }

            return messageDiv;
        }

        function buildFollowUpQuestions(responseText, followUpRound = 0) {
            const text = String(responseText || '');
            const modelMatch = text.match(/产品型号[：:]\s*([^\n]+)/);
            const model = modelMatch ? modelMatch[1].trim() : '';

            const stage = Math.max(0, parseInt(followUpRound, 10) || 0);

            const pools = [
                [
                    model
                        ? `和同品牌最新款相比，${model}主要差距在哪里？现在入手还值得吗？`
                        : '和同品牌最新款相比，这款主要差距在哪里？现在入手还值得吗？',
                    model
                        ? `如果预算差不多，有没有更值得买的替代机型（含${model}的对比）？`
                        : '如果预算差不多，有没有更值得买的替代机型？',
                    '如果我不急用，建议等到哪个时间点/促销节点再买更合适？'
                ],
                [
                    model
                        ? `${model}有哪些配置/版本最推荐？哪些版本不建议入手？`
                        : '这款产品有哪些配置/版本最推荐？哪些版本不建议入手？',
                    model
                        ? `如果考虑二手/官翻渠道，${model}该怎么挑成色与电池/保修，避坑点有哪些？`
                        : '如果考虑二手/官翻渠道，该怎么挑成色与电池/保修，避坑点有哪些？',
                    '如果我主要用来办公/学习/游戏/拍照，选购时最该关注哪些参数？'
                ],
                [
                    model
                        ? `能把${model}和同价位两到三款热门竞品做个横向对比，并给出推荐顺序吗？`
                        : '能把这款和同价位两到三款热门竞品做个横向对比，并给出推荐顺序吗？',
                    '如果预算上浮 10% / 下调 10%，推荐怎么选更划算？',
                    '如果我想等一个“更低但不难等到”的价格，你建议设置多少心理价位？'
                ]
            ];

            const poolIndex = stage === 0 ? 0 : (stage === 1 ? 1 : 2);
            return pools[poolIndex];
        }

        function attachFollowUpChips(messageEl, questions, forceShow = false) {
            if (!messageEl || !Array.isArray(questions) || questions.length === 0) return;
            if (!messageEl.classList.contains('assistant')) return;
            if (!forceShow) {
                const shouldShow = messageEl.innerText.includes('推荐购买指数') || messageEl.innerText.includes('价格生命线') || messageEl.innerText.includes('产品型号');
                if (!shouldShow) return;
            }

            const container = document.createElement('div');
            container.className = 'follow-ups';

            questions.slice(0, 3).forEach(q => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'follow-up-chip';
                chip.innerHTML = `
                    <div class="follow-up-chip-text">${escapeHtml(q)}</div>
                    <div class="follow-up-chip-arrow">→</div>
                `;
                chip.addEventListener('click', () => {
                    state.lastSendSource = 'followUp';
                    textInput.value = q;
                    handleTextInput();
                    sendMessage();
                });
                container.appendChild(chip);
            });

            messageEl.appendChild(container);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleQuickAction(guideText) {
            if (!guideText) return;
            addMessage(guideText, 'assistant');
            textInput.value = '';
            textInput.focus();
            handleTextInput();
        }

        // Format AI response with proper line breaks and structure
        function formatAIResponse(text) {
            let formatted = '';
            
            // Split by empty lines (sections)
            const sections = text.split(/\n\n+/).filter(s => s.trim());
            
            // White text with subtle shadow for readability
            const baseStyle = 'color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,0.6);';
            
            sections.forEach((section, index) => {
                section = section.trim();
                
                // Check if this is the price lifeline section (contains price data with 📉 emoji)
                if (section.includes('📉') || section.includes('价格生命线')) {
                    // Parse price timeline and create chart
                    const { priceData, floorPrice } = parsePriceData(section);
                    
                    // Fixed header: 价格生命线：
                    formatted += '<div style="margin-bottom: 16px;">';
                    formatted += `<div style="font-weight: 600; margin-bottom: 8px; ${baseStyle}">价格生命线：</div>`;
                    
                    // Create table
                    formatted += '<table style="width: 100%; border-collapse: collapse; margin-bottom: 12px;">';
                    formatted += '<thead>';
                    formatted += '<tr style="background: rgba(255,255,255,0.1);">';
                    formatted += `<th style="padding: 8px; text-align: center; ${baseStyle}">时间/事件</th>`;
                    formatted += `<th style="padding: 8px; text-align: center; ${baseStyle}">价格</th>`;
                    formatted += '</tr>';
                    formatted += '</thead>';
                    formatted += '<tbody>';
                    
                    const pricePairs = parsePricePairs(section);
                    const orderedPairs = [
                        ...pricePairs.filter(p => !p.isFloor && !p.isPrediction),
                        ...pricePairs.filter(p => !p.isFloor && p.isPrediction),
                        ...pricePairs.filter(p => p.isFloor)
                    ];
                    
                    // Render table rows
                    orderedPairs.forEach(pair => {
                        const rowStyle = pair.isFloor
                            ? 'background: rgba(245, 158, 11, 0.22);'
                            : (pair.isPrediction ? 'background: rgba(147, 51, 234, 0.2);' : '');
                        
                        formatted += `<tr style="${rowStyle}; border-bottom: 1px solid rgba(255,255,255,0.1); min-height: 40px;">`;
                        formatted += `<td style="padding: 10px 8px; ${baseStyle}; text-align: center; white-space: normal;">${pair.timeEvent}</td>`;
                        formatted += `<td style="padding: 10px 8px; ${baseStyle}; text-align: center; white-space: nowrap;">${pair.price}</td>`;
                        formatted += '</tr>';
                    });
                    
                    formatted += '</tbody>';
                    formatted += '</table>';
                    formatted += '</div>';
                    
                    // Add price chart if we have data
                    if (priceData.length > 0) {
                        formatted += generatePriceChart(priceData, floorPrice);
                    }
                } else {
                    // Format other sections with white text, preserving newlines
                    formatted += `<div style="margin-bottom: 12px; ${baseStyle}; white-space: pre-wrap;">${escapeHtml(expandStarRating(section))}</div>`;
                }
                
                // Add space between sections
                if (index < sections.length - 1) {
                    formatted += '<div style="height: 8px;"></div>';
                }
            });
            
            return formatted;
        }

        // Parse price data from AI response
        function parsePriceData(text) {
            const pairs = parsePricePairs(text);
            const floorCandidate = pairs.find(p => p.isFloor);
            const floorPrice = floorCandidate ? parseInt(String(floorCandidate.price).replace(/[^\d]/g, ''), 10) : null;
            const orderedPairs = [
                ...pairs.filter(p => !p.isFloor && !p.isPrediction),
                ...pairs.filter(p => !p.isFloor && p.isPrediction)
            ];
            const priceData = orderedPairs
                .map(p => {
                    const numeric = parseInt(String(p.price).replace(/[^\d]/g, ''), 10);
                    return {
                        label: p.timeEvent,
                        price: numeric,
                        isPrediction: p.isPrediction
                    };
                })
                .filter(p => !isNaN(p.price));
            console.log('Parsed price data:', priceData);
            return { priceData, floorPrice: Number.isFinite(floorPrice) ? floorPrice : null };
        }

        function expandStarRating(text) {
            const str = String(text || '');
            return str.replace(/推荐购买指数\s*[：:]\s*(?:⭐️\s*)?([1-5])\s*星/g, (match, nStr) => {
                const n = parseInt(nStr, 10);
                if (!Number.isFinite(n) || n < 1 || n > 5) return match;
                return `推荐购买指数：${'⭐️'.repeat(n)} ${n}星`;
            });
        }

        function parsePricePairs(text) {
            const now = PRICE_TIMELINE_NOW;
            const normalized = String(text || '')
                .replace(/^价格生命线[图：:]*\s*/g, '')
                .replace(/📉/g, '\n')
                .replace(/；/g, '\n')
                .replace(/。/g, '\n')
                .replace(/,\s*/g, '\n')
                .replace(/，\s*/g, '\n');

            const lines = normalized.split('\n').map(s => s.trim()).filter(Boolean);
            const pairs = [];

            const pickIsPrediction = (label, explicitPredict) => {
                if (!label) return false;
                const l = String(label);
                if (l.includes('当前')) return false;

                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1;
                const currentDay = now.getDate();

                const yearMatch = l.match(/(\d{4})年?/);
                if (yearMatch) {
                    const year = parseInt(yearMatch[1], 10);
                    if (Number.isFinite(year)) {
                        if (year < currentYear) return false;
                        if (year > currentYear) return true;

                        const monthMatch = l.match(/(\d{1,2})月/);
                        if (monthMatch) {
                            const month = parseInt(monthMatch[1], 10);
                            if (Number.isFinite(month)) {
                                if (month < currentMonth) return false;
                                if (month > currentMonth) return true;

                                const dayMatch = l.match(/(\d{1,2})日/);
                                if (dayMatch) {
                                    const day = parseInt(dayMatch[1], 10);
                                    if (Number.isFinite(day)) {
                                        return day > currentDay;
                                    }
                                }
                            }
                        }
                        return explicitPredict;
                    }
                }

                const monthMatch = l.match(/(\d{1,2})月/);
                if (monthMatch) {
                    const month = parseInt(monthMatch[1], 10);
                    if (Number.isFinite(month)) {
                        if (month < currentMonth) return false;
                        if (month > currentMonth) return true;

                        const dayMatch = l.match(/(\d{1,2})日/);
                        if (dayMatch) {
                            const day = parseInt(dayMatch[1], 10);
                            if (Number.isFinite(day)) {
                                return day > currentDay;
                            }
                        }
                    }
                }

                if (/618/.test(l)) return true;
                if (/双11|双十一/.test(l)) return true;
                if (/双12|双十二/.test(l)) return true;
                if (/年中|暑期|开学季/.test(l)) return true;

                return explicitPredict;
            };

            const pushPair = (label, priceStr) => {
                const rawLabel = String(label || '');
                const explicitPredict = rawLabel.includes('（预测）') || rawLabel.includes('预测') || rawLabel.includes('预计') || rawLabel.includes('未来');
                const labelForRange = rawLabel.replace(/（预测）/g, '').replace(/\(预测\)/g, '');
                const rangeStartMatch = labelForRange.match(/([\d,]{3,})\s*[-～—~]\s*$/);
                const mergedLabel = rangeStartMatch ? rawLabel.replace(rangeStartMatch[0], '') : rawLabel;
                const mergedPriceStr = rangeStartMatch ? `${rangeStartMatch[1]}-${priceStr}` : priceStr;

                const cleanedLabel = mergedLabel.replace(/（预测）/g, '');
                const timeEvent = cleanedLabel
                    .replace(/[📌📍]/g, '')
                    .replace(/降至|到手|跌到|跌至|稳定在|发售价|售价/g, '')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .replace(/^[，,。.、:：\s]+/, '')
                    .replace(/[，,。.、:：\s]+$/, '');
                if (/波动|幅度/.test(timeEvent)) return;
                const priceNumText = String(mergedPriceStr || '').replace(/,/g, '').replace(/[^\d-]/g, '');
                const rangeParts = priceNumText
                    .split('-')
                    .map(s => s.trim())
                    .filter(Boolean)
                    .map(s => parseInt(s, 10))
                    .filter(n => Number.isFinite(n));
                let finalPriceNum = null;
                if (rangeParts.length >= 2) {
                    finalPriceNum = Math.round((rangeParts[0] + rangeParts[1]) / 2);
                } else if (rangeParts.length === 1) {
                    finalPriceNum = rangeParts[0];
                }
                const price = finalPriceNum ? `${finalPriceNum}元` : '';
                if (!timeEvent || timeEvent.match(/^[，,。.、\s]+$/)) return;
                if (!price || price === '元') return;
                const isPrediction = pickIsPrediction(timeEvent, explicitPredict);
                const isFloor = /最低不会低于|不会低于|下限/.test(timeEvent);
                pairs.push({
                    timeEvent: isPrediction ? `${timeEvent}（预测）` : timeEvent,
                    price,
                    isPrediction,
                    isFloor
                });
            };

            lines.forEach(line => {
                if (!line) return;

                const byColon = line.match(/(.+?)\s*[：:→]\s*([\d,]{3,})\s*元?/);
                if (byColon) {
                    pushPair(byColon[1], byColon[2]);
                    return;
                }

                const regex = /(.+?)([\d,]{3,})\s*元/g;
                let m;
                let found = false;
                while ((m = regex.exec(line)) !== null) {
                    found = true;
                    pushPair(m[1], m[2]);
                }
                if (found) return;

                const priceOnly = line.match(/([\d,]{3,})\s*元/);
                if (priceOnly) {
                    pushPair(line.replace(priceOnly[0], ''), priceOnly[1]);
                }
            });

            return pairs;
        }

        // Generate price chart using Canvas
        function generatePriceChart(priceData, floorPrice) {
            if (priceData.length < 2) {
                console.log('Not enough price data to generate chart:', priceData.length);
                return '';
            }
            
            // Calculate min and max price for Y axis
            const prices = priceData.map(d => d.price);
            const minPrice = Math.max(0, Math.min(...prices) - 500);
            const maxPrice = Math.max(...prices) + 500;
            
            // Determine Y axis scale
            const yMax = Math.ceil(maxPrice / 1000) * 1000;
            const yMin = 0;
            
            // Create chart container
            const chartId = 'priceChart_' + Date.now();
            
            // Use requestAnimationFrame to ensure DOM is ready
            requestAnimationFrame(() => {
                drawChart(chartId, priceData, yMin, yMax, floorPrice);
            });
            
            return `<div style="margin-top: 16px; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 16px;">📈</span>
                        <span style="font-size: 14px; font-weight: 600; color: #fff;">价格走势</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 16px; font-size: 12px;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div style="width: 16px; height: 2px; background: #3b82f6;"></div>
                            <span style="color: rgba(255,255,255,0.7);">历史</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div style="width: 16px; height: 2px; background: #a855f7; border-style: dashed;"></div>
                            <span style="color: rgba(255,255,255,0.7);">预测</span>
                        </div>
                    </div>
                </div>
                <canvas id="${chartId}" style="width: 100%; height: 220px; border-radius: 12px; background: rgba(30, 27, 75, 0.8);"></canvas>
            </div>`;
        }

        // Draw the chart on canvas
        function drawChart(canvasId, priceData, yMin, yMax, floorPrice) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) {
                console.error('Canvas element not found:', canvasId);
                return;
            }
            
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Cannot get 2D context from canvas');
                return;
            }
            
            // Set canvas size
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const width = rect.width;
            const height = rect.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Padding
            const padding = { top: 35, right: 20, bottom: 45, left: 55 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            // Calculate positions
            const xStep = chartWidth / (priceData.length - 1);
            const yRange = yMax - yMin;

            if (Number.isFinite(floorPrice)) {
                const floorY = padding.top + chartHeight - ((floorPrice - yMin) / yRange) * chartHeight;
                if (floorY >= padding.top && floorY <= padding.top + chartHeight) {
                    ctx.beginPath();
                    ctx.moveTo(padding.left, floorY);
                    ctx.lineTo(width - padding.right, floorY);
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const label = `下限 ${floorPrice}`;
                    ctx.fillStyle = 'rgba(0,0,0,0.65)';
                    ctx.font = 'bold 11px sans-serif';
                    const textWidth = ctx.measureText(label).width;
                    const boxW = textWidth + 12;
                    const boxH = 18;
                    const boxX = width - padding.right - boxW;
                    const boxY = Math.max(padding.top, Math.min(floorY - boxH - 6, padding.top + chartHeight - boxH));
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, boxW, boxH, 6);
                    ctx.fill();
                    ctx.fillStyle = '#f59e0b';
                    ctx.textAlign = 'left';
                    ctx.fillText(label, boxX + 6, boxY + 12.5);
                }
            }
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            
            // Horizontal grid lines
            const gridLines = 4;
            for (let i = 0; i <= gridLines; i++) {
                const y = padding.top + (chartHeight / gridLines) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                
                // Y axis labels
                const price = yMax - (yRange / gridLines) * i;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(price >= 1000 ? (price / 1000) + 'k' : price + '', padding.left - 8, y + 4);
            }
            
            // Draw lines first (to appear behind points)
            priceData.forEach((data, i) => {
                if (i > 0) {
                    const x = padding.left + xStep * i;
                    const y = padding.top + chartHeight - ((data.price - yMin) / yRange) * chartHeight;
                    const lastX = padding.left + xStep * (i - 1);
                    const lastY = padding.top + chartHeight - ((priceData[i - 1].price - yMin) / yRange) * chartHeight;
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = data.isPrediction ? '#a855f7' : '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash(data.isPrediction ? [5, 5] : []);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });
            
            // Draw points with price labels
            priceData.forEach((data, i) => {
                const x = padding.left + xStep * i;
                const y = padding.top + chartHeight - ((data.price - yMin) / yRange) * chartHeight;
                
                // Draw price label bubble above point
                const priceStr = data.price.toString();
                const textWidth = ctx.measureText(priceStr).width;
                const bubbleWidth = textWidth + 12;
                const bubbleHeight = 20;
                
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.roundRect(x - bubbleWidth / 2, y - 35, bubbleWidth, bubbleHeight, 6);
                ctx.fill();
                
                ctx.fillStyle = data.isPrediction ? '#a855f7' : '#3b82f6';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(priceStr, x, y - 22);
                
                // Draw point
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = data.isPrediction ? '#a855f7' : '#3b82f6';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw X axis label (time)
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(data.label.length > 5 ? data.label.substring(0, 5) : data.label, x, height - padding.bottom + 20);
            });
            
            // Draw Y axis label
            ctx.save();
            ctx.translate(18, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('价格 (元)', 0, 0);
            ctx.restore();
            
            console.log('Chart drawn successfully:', canvasId);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Call Doubao API
        async function callDoubaoAPI(userText, images) {
            const messages = [
                {
                    role: 'system',
                    content: SYSTEM_PROMPT
                }
            ];

            // Add chat history
            state.chatHistory.forEach(msg => {
                if (msg.role === 'user' || msg.role === 'assistant') {
                    let content = [];
                    if (msg.images && msg.images.length > 0) {
                        msg.images.forEach(img => {
                            content.push({
                                type: 'image_url',
                                image_url: {
                                    url: img.data
                                }
                            });
                        });
                    }
                    if (msg.content) {
                        content.push({
                            type: 'text',
                            text: msg.content
                        });
                    }
                    messages.push({
                        role: msg.role,
                        content: content.length > 0 ? content : msg.content
                    });
                }
            });

            // Build current message content
            let currentContent = [];
            if (images && images.length > 0) {
                images.forEach(img => {
                    currentContent.push({
                        type: 'image_url',
                        image_url: {
                            url: img.data
                        }
                    });
                });
            }
            if (userText) {
                currentContent.push({
                    type: 'text',
                    text: userText
                });
            }

            messages.push({
                role: 'user',
                content: currentContent.length > 0 ? currentContent : userText
            });

            const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                },
                body: JSON.stringify({
                    model: state.modelId,
                    messages: messages,
                    stream: false,
                    temperature: 0.7,
                    max_tokens: 2000,
                    thinking: {
                        type: 'disabled'
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `API 请求失败 (${response.status})`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // Settings functions
        function openSettings() {
            apiKeyInput.value = state.apiKey;
            settingsModal.classList.add('show');
        }

        function closeSettings() {
            settingsModal.classList.remove('show');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            const model = modelIdInput.value.trim();
            if (key && model) {
                state.apiKey = key;
                state.modelId = model;
                localStorage.setItem('doubao_api_key', key);
                localStorage.setItem('doubao_model_id', model);
                closeSettings();
            } else {
                alert('请同时填写API Key和接入点ID');
            }
        }

        // Initialize app
        init();
    </script>
